<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cult • Club Gallery</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --secondary-text: #888888;
            --smooth-ease: cubic-bezier(0.25, 1, 0.5, 1);
            --smooth-duration: 0.6s;
            --like-color: #ff2d55;
            --font-main: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color); color: var(--text-color);
            overflow: hidden; position: fixed; width: 100%; height: 100%;
            user-select: none;
            -webkit-font-smoothing: antialiased; 
        }

        /* --- БЛЮР-МАСКИ --- */
        .blur-mask-top {
            position: fixed; top: 0; left: 0; right: 0; height: 180px; z-index: 150;
            pointer-events: none; 
            background: rgba(255, 255, 255, 0.01); 
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            -webkit-mask-image: linear-gradient(to bottom, black 10%, transparent 90%);
            mask-image: linear-gradient(to bottom, black 10%, transparent 90%);
            transform: translateZ(0);
            will-change: backdrop-filter;
        }
        .blur-mask-bottom {
            position: fixed; bottom: 0; left: 0; right: 0; height: 200px; z-index: 90;
            pointer-events: none; 
            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            -webkit-mask-image: linear-gradient(to top, black 10%, transparent 90%);
            mask-image: linear-gradient(to top, black 10%, transparent 90%);
            transform: translateZ(0);
            will-change: backdrop-filter;
        }

        /* --- ЛОГОТИП --- */
        .floating-logo {
            position: fixed; top: 15px; left: 50%; 
            transform: translateX(-50%) scale(1);
            z-index: 9999; 
            pointer-events: none; 
            width: 47%; max-width: 250px; 
            transition: transform var(--smooth-duration) var(--smooth-ease);
        }
        .floating-logo img { 
            width: 100%; height: auto; object-fit: contain; 
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.4)) drop-shadow(0 2px 4px rgba(0,0,0,0.2)); 
            transition: filter 0.3s ease;
        }
        .floating-logo.shrunk { transform: translateX(-50%) scale(0.95); }
        body.modal-open .floating-logo img { filter: blur(10px) drop-shadow(0 8px 16px rgba(0,0,0,0.4)); }

        /* --- ЛЕНТА --- */
        .feed {
            height: 100vh; overflow-y: scroll; scroll-behavior: smooth;
            padding-top: 80px; padding-bottom: 100px; 
            display: flex; flex-direction: column; align-items: center;
            padding-left: 7px; padding-right: 7px;
            scrollbar-width: none; 
            -ms-overflow-style: none; 
            transition: filter 0.3s ease;
        }
        .feed::-webkit-scrollbar { width: 0px; display: none; }
        body.modal-open .feed { filter: blur(10px); }

        .post { 
            width: 100%; max-width: 500px; margin-bottom: 30px; 
            display: flex; flex-direction: column; position: relative; 
        }
        
        .image-container { position: relative; width: 100%; }
        .post img { width: 100%; height: auto; max-height: 80vh; object-fit: cover; background-color: #f0f0f0; border-radius: 8px; display: block; }

        /* --- КНОПКИ ПОД ФОТО (БЕЗ БЛЮРА) --- */
        .action-btn {
            width: 40px; height: 40px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            border-radius: 50%; 
            position: relative;
            cursor: pointer; transition: transform 0.2s ease; flex-shrink: 0;
        }

        .action-btn svg { 
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            display: block;
        }

        .profile-btn svg { 
            width: 22px; height: 22px; 
            stroke: black; stroke-width: 2; fill: transparent; 
            transition: stroke 0.2s, fill 0.2s; 
        }

        .like-btn svg { 
            width: 19px; height: 19px; 
            stroke: black; stroke-width: 2; fill: transparent; 
            transition: stroke 0.2s, fill 0.2s; 
        }

        .action-btn:active { transform: scale(0.85); }
        .like-btn.liked svg { stroke: var(--like-color); fill: var(--like-color); }

        /* --- ИНФО БЛОК --- */
        .post-info { 
            display: flex; align-items: center; 
            padding-top: 15px; padding-left: 7px; padding-right: 7px;
            font-size: 13px; font-weight: 400; letter-spacing: -0.2px;
            position: relative; z-index: 100; width: 100%; gap: 10px; 
        }
        .info-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
        .tag-wrapper {
            flex: 1; min-width: 0; overflow: hidden; display: flex; align-items: center;
            -webkit-mask-image: linear-gradient(to right, black 80%, transparent 100%);
            mask-image: linear-gradient(to right, black 80%, transparent 100%);
        }
        .post-tag { color: var(--text-color); text-decoration: none; font-weight: 500; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; padding-bottom: 2px; display: inline-block; }
        .info-divider { color: var(--secondary-text); font-size: 20px; line-height: 1; display: flex; align-items: center; justify-content: center; flex-shrink: 0; letter-spacing: 2px; padding: 0 5px; }
        .info-right { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; justify-content: flex-end; }
        .post-date { color: var(--secondary-text); font-size: 13px; white-space: nowrap; flex-shrink: 0; }
        .post.static-post { margin-bottom: 10px; }

        /* --- НИЖНЯЯ ПАНЕЛЬ (БЕЗ БЛЮРА) --- */
        .bottom-controls {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(0);
            z-index: 300; display: flex; align-items: center; justify-content: center; gap: 15px;
            transition: opacity 0.3s var(--smooth-ease), transform 0.3s var(--smooth-ease);
            opacity: 1;
        }

        .bottom-controls.hidden { 
            opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(20px);
        }

        .liquid-glass {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 50%; 
            position: relative;
            cursor: pointer;
            transition: transform var(--smooth-duration) var(--smooth-ease);
        }
        
        .liquid-glass svg { 
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            display: block;
            width: 24px; height: 24px; 
            stroke: black; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: 0.8; 
        }

        .btn-search, .btn-likes { width: 50px; height: 50px; }
        .btn-add { width: 65px; height: 65px; }

        .bottom-controls.shrunk .btn-search,
        .bottom-controls.shrunk .btn-likes { transform: scale(0.85); }
        .bottom-controls.shrunk .btn-add { transform: scale(0.85); }

        /* --- КНОПКА СТРЕЛКА (БЕЗ БЛЮРА) --- */
        .btn-down {
            position: fixed; bottom: 37px; right: 20px; width: 50px; height: 50px; z-index: 300;
            transition: transform var(--smooth-duration) var(--smooth-ease), opacity 0.6s var(--smooth-ease), visibility 0.6s var(--smooth-ease);
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex; justify-content: center; align-items: center;
        }
        .btn-down svg { display: block; margin: auto; stroke: #ffffff; width: 24px; height: 24px;}
        .btn-down.hidden { opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(15px) scale(0.8); }

        /* --- МОДАЛКИ (БЕЗ БЛЮРА) --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.2); display: none;
            justify-content: center; align-items: flex-end; z-index: 200; 
            opacity: 0; transition: opacity 0.4s ease;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        
        .modal-content {
            background: rgba(255, 255, 255, 0.98); 
            border-top: 1px solid rgba(0, 0, 0, 0.1); 
            width: 100%; max-width: 500px;
            border-radius: 24px 24px 0 0; height: 60vh; 
            display: flex; flex-direction: column;
            transform: translateY(100%); opacity: 0; 
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease; 
            box-shadow: 0 -10px 40px rgba(0,0,0,0.15);
            position: relative; z-index: 201; overflow: hidden;
        }
        
        .modal-overlay.active .modal-content { transform: translateY(0); opacity: 1; }
        
        .modal-drag-area {
            padding: 30px 20px 15px;
            flex-shrink: 0;
            cursor: grab;
            position: relative;
            touch-action: none; 
        }
        
        .modal-content::before {
            content: ''; position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            width: 40px; height: 4px; background: rgba(0,0,0,0.1); border-radius: 2px;
        }

        .modal-body {
            flex: 1; overflow-y: auto; padding: 0 20px 20px;
            overscroll-behavior: contain; display: flex; flex-direction: column;
        }
        
        .modal-body::-webkit-scrollbar { width: 0px; display: none; }
        .modal-body { scrollbar-width: none; -ms-overflow-style: none; }

        .modal-title { font-size: 18px; font-weight: 600; text-align: center; color: #000; margin: 0; }

        /* --- МОДАЛКА ОТПРАВКИ --- */
        #submitModal .modal-body { gap: 15px; }

        .file-upload-wrapper {
            position: relative; width: 100%; flex: 1; min-height: 120px; 
            border: 2px dashed rgba(0,0,0,0.15); border-radius: 16px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(255, 255, 255, 0.4); cursor: pointer; overflow: hidden;
        }
        .file-upload-wrapper input[type="file"] { position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .upload-icon svg { width: 32px; height: 32px; stroke: #555; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; margin-bottom: 10px; display: block; margin-left: auto; margin-right: auto; }
        .upload-text { font-size: 14px; color: #555; font-weight: 400; }
        .preview-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: none; z-index: 2; }

        .modal-content input[type="text"] {
            width: 100%; padding: 16px; border: 1px solid rgba(0,0,0,0.1); 
            background: rgba(255, 255, 255, 0.6); border-radius: 14px; font-size: 16px; 
            outline: none; font-family: inherit; flex-shrink: 0;
        }
        
        .btn-submit {
            width: 100%; padding: 16px; background: #000; color: #fff; border: none; border-radius: 14px; 
            font-size: 16px; font-weight: 600; cursor: pointer; font-family: inherit; flex-shrink: 0; transition: opacity 0.2s;
            text-transform: uppercase;
        }
        .btn-submit:active { opacity: 0.8; }

        /* --- МОДАЛКА ПОИСКА И ЛАЙКОВ --- */
        .search-header { display: flex; align-items: center; justify-content: center; position: relative; }
        .tags-list { display: flex; flex-direction: column; }
        
        .alphabet-header { font-size: 15px; font-weight: 600; color: #000; padding: 15px 0 5px 10px; background: transparent; position: relative; z-index: 1; }

        .tag-item { padding: 12px 15px; background: rgba(0, 0, 0, 0.05); border-radius: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; transition: background 0.2s; }
        .tag-item:active { background: rgba(0, 0, 0, 0.1); }
        .tag-info { display: flex; flex-direction: column; flex: 1; min-width: 0; }
        .tag-name { font-weight: 500; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tag-count { font-size: 13px; color: var(--secondary-text); font-weight: 400; }

        .tag-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
            margin-left: 10px;
        }

        .author-grid, .likes-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding-bottom: 20px; width: 100%; }
        .grid-item { width: 100%; aspect-ratio: 1 / 1; overflow: hidden; border-radius: 8px; cursor: pointer; background: #eee; transition: opacity 0.2s; }
        .grid-item:active { opacity: 0.7; }
        .grid-item img { width: 100%; height: 100%; object-fit: cover; }

        .btn-back-floating {
            position: fixed; bottom: 37px; left: 50%; transform: translateX(-50%) translateY(20px);
            width: 50px; height: 50px; z-index: 400; opacity: 0; visibility: hidden;
            transition: transform 0.3s var(--smooth-ease), opacity 0.3s ease, visibility 0.3s;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35), 0 8px 20px rgba(0, 0, 0, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.5);
            display: flex; justify-content: center; align-items: center;
        }
        .btn-back-floating.active { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
        .btn-back-floating svg { display: block; margin: auto; width: 24px; height: 24px; stroke: black; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }

        .delete-confirm-modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5); display: none;
            justify-content: center; align-items: center; z-index: 500;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .delete-confirm-modal.active { display: flex; opacity: 1; }
        .delete-confirm-content { background: #fff; border-radius: 16px; padding: 25px; width: 80%; max-width: 300px; text-align: center; transform: scale(0.9); transition: transform 0.3s var(--smooth-ease); }
        .delete-confirm-modal.active .delete-confirm-content { transform: scale(1); }
        .delete-confirm-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .delete-confirm-btn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; font-family: inherit; }
        .btn-cancel { background: #eee; color: #000; }
        .btn-delete { background: #ff3b30; color: #fff; }

        /* --- КНОПКИ SUPPORT И CHAT --- */
        .support-wrapper {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
            margin-bottom: 30px; 
        }

        .support-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 30px;
            background: #000;
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s ease, opacity 0.2s;
            cursor: pointer;
            width: 160px;
        }
        .support-btn:active { transform: scale(0.95); opacity: 0.8; }

        .chat-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.7);
            color: #000;
            text-decoration: none;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.2s ease, opacity 0.2s;
            cursor: pointer;
            width: 160px;
        }
        .chat-btn:active { transform: scale(0.95); opacity: 0.8; }
    </style>
</head>
<body>

    <div class="blur-mask-top"></div>
    <div class="blur-mask-bottom"></div>

    <div class="floating-logo" id="logo">
        <img src="logo.png" alt="Logo">
    </div>

    <main class="feed" id="feed"></main>

    <div class="bottom-controls" id="bottomControls">
        <button class="liquid-glass btn-search" onclick="openSearchModal()">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </button>
        
        <button class="liquid-glass btn-add" onclick="openModal('submitModal')">
            <svg class="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>

        <button class="liquid-glass btn-likes" onclick="openLikesModal()">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
        </button>
    </div>

    <button class="liquid-glass btn-down hidden" id="btnDown" onclick="scrollToBottom()">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
    </button>

    <button class="liquid-glass btn-back-floating" id="btnBackFloating" onclick="showTagsList()">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>

    <!-- МОДАЛКА ОТПРАВКИ -->
    <div class="modal-overlay" id="submitModal" onclick="closeModal(event, 'submitModal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-drag-area">
                <div class="modal-title">Загрузка медиа</div>
            </div>
            <div class="modal-body">
                <div class="file-upload-wrapper">
                    <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(this)">
                    <img src="" class="preview-image" id="previewImage" alt="Preview">
                    <div class="upload-icon" id="uploadIcon">
                        <svg viewBox="0 0 24 24">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                    </div>
                    <div class="upload-text" id="uploadText">Нажмите, чтобы выбрать файл</div>
                </div>
                <input type="text" id="tagInput" placeholder="Ваш тег (например, @username)" value="@">
                <button class="btn-submit" onclick="submitPhoto()">Отправить</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА ПОИСКА -->
    <div class="modal-overlay" id="searchModal" onclick="closeModal(event, 'searchModal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-drag-area">
                <div class="modal-title" id="searchTitle">Поиск по тегам</div>
            </div>
            <div class="modal-body">
                <div id="tagsView">
                    <div class="tags-list" id="tagsList"></div>
                </div>
                <div id="gridView" style="display:none;">
                    <div class="author-grid" id="authorGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА ЛАЙКОВ -->
    <div class="modal-overlay" id="likesModal" onclick="closeModal(event, 'likesModal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-drag-area">
                <div class="modal-title">Избранное</div>
            </div>
            <div class="modal-body">
                <div class="likes-grid" id="likesGrid"></div>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА УДАЛЕНИЯ -->
    <div class="delete-confirm-modal" id="deleteConfirmModal">
        <div class="delete-confirm-content">
            <div class="delete-confirm-title">Удалить этот файл?</div>
            <div class="delete-confirm-buttons">
                <button class="delete-confirm-btn btn-cancel" onclick="closeDeleteConfirm()">Отмена</button>
                <button class="delete-confirm-btn btn-delete" onclick="confirmDelete()">Удалить</button>
            </div>
        </div>
    </div>

    <canvas id="compressCanvas" style="display:none;"></canvas>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        tg.disableVerticalSwipes();

        let currentUserId = tg.initDataUnsafe?.user?.id;

        if (!currentUserId && tg.initData) {
            try {
                const urlParams = new URLSearchParams(tg.initData);
                const userStr = urlParams.get('user');
                if (userStr) {
                    const userObj = JSON.parse(userStr);
                    currentUserId = userObj.id;
                }
            } catch (e) {
                console.error("Не удалось распарсить initData", e);
            }
        }

        if (!currentUserId) {
            currentUserId = localStorage.getItem('browser_user_id');
            if (!currentUserId) {
                currentUserId = Math.floor(Math.random() * 1000000000);
                localStorage.setItem('browser_user_id', currentUserId);
            }
        }

        const supabaseUrl = 'https://asoljhfvsrxmeniwsvel.supabase.co';
        const supabaseKey = 'sb_publishable_zRTzYg6bqdPH4JYRIngTMQ_K0JNe7zG';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        const ADMIN_ID = 424175344;
        const isAdmin = currentUserId === ADMIN_ID;

        const feed = document.getElementById('feed');
        const btnDown = document.getElementById('btnDown');
        const bottomControls = document.getElementById('bottomControls');
        const btnBackFloating = document.getElementById('btnBackFloating');
        const logo = document.getElementById('logo');
        const submitModal = document.getElementById('submitModal');
        const previewImage = document.getElementById('previewImage');

        let allPostsData = []; 
        let likedPhotos = []; 
        let likedTags = [];
        let postToDelete = null;
        let currentFileToUpload = null;
        
        let scrollTimeout;
        let hideArrowTimeout;
        let pressTimer = null;
        let isLongPress = false;

        // 1. ЗАГРУЗКА ДАННЫХ (ИСПРАВЛЕНО РАЗДЕЛЕНИЕ ЗАПРОСОВ)
        async function loadRealPhotos(isInitialLoad = false) {
            // Сначала грузим фото БЕЗ вложенных лайков, чтобы не было ошибки 400
            const { data, error } = await supabaseClient
                .from('photos')
                .select('*')
                .eq('status', 'approved')
                .order('created_at', { ascending: true });

            if (error) {
                console.error("Ошибка загрузки фото:", error);
                return;
            }

            // Потом отдельно грузим лайки пользователя
            const { data: myLikes, error: likesError } = await supabaseClient
                .from('likes')
                .select('photo_id, tag')
                .eq('user_id', currentUserId);
            
            if (likesError) {
                console.error("Ошибка загрузки лайков:", likesError);
            }

            likedPhotos = myLikes ? [...new Set(myLikes.filter(l => l.photo_id).map(l => l.photo_id))] : [];
            likedTags = myLikes ? [...new Set(myLikes.filter(l => l.tag).map(l => l.tag))] : [];

            if (!isInitialLoad) {
                likedPhotos.forEach(id => {
                    const btn = document.querySelector(`#post-${id} .like-btn`);
                    if (btn) btn.classList.add('liked');
                });
                document.querySelectorAll('.like-btn.liked').forEach(btn => {
                    const postElement = btn.closest('.post');
                    if (postElement) {
                        const postId = parseInt(postElement.dataset.id);
                        if (!likedPhotos.includes(postId)) {
                            btn.classList.remove('liked');
                        }
                    }
                });
                return;
            }

            feed.innerHTML = ''; 
            allPostsData = []; 

            feed.insertAdjacentHTML('afterbegin', `
                <div class="post static-post">
                    <div class="image-container"><img src="2.png" alt="Static"></div>
                </div>
                <div class="post static-post">
                    <div class="image-container"><img src="1.png" alt="Static"></div>
                </div>
            `);

            if (data && data.length > 0) {
                data.forEach((post) => {
                    allPostsData.push({ tag: post.tag, img: post.image_url, id: post.id });

                    const isLiked = likedPhotos.includes(post.id);

                    const dateStr = new Date(post.created_at).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }) + ' ' + 
                                    new Date(post.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

                    feed.insertAdjacentHTML('beforeend', `
                        <div class="post" id="post-${post.id}" data-id="${post.id}">
                            <div class="image-container">
                                <img src="${post.image_url}" alt="Photo" class="dynamic-img">
                            </div>
                            <div class="post-info">
                                <div class="info-left">
                                    <button class="action-btn profile-btn" onclick="openTelegramLink('${post.tag}')">
                                        <svg viewBox="0 0 24 24">
                                            <circle cx="12" cy="12" r="10"></circle>
                                            <circle cx="12" cy="9" r="3"></circle>
                                            <path d="M6.5 18.5c1.5-2 3.5-3 5.5-3s4 1 5.5 3"></path>
                                        </svg>
                                    </button>
                                    <div class="tag-wrapper">
                                        <span class="post-tag" onclick="openTelegramLink('${post.tag}')">${post.tag}</span>
                                    </div>
                                </div>

                                <div class="info-divider">•••</div>

                                <div class="info-right">
                                    <span class="post-date">${dateStr}</span>
                                    <button class="action-btn like-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike(event, '${post.id}')">
                                        <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `);
                });
            } else {
                feed.insertAdjacentHTML('beforeend', `<p style="text-align:center; width:100%; padding: 20px; color:#888;">Пока нет одобренных медиа</p>`);
            }

            [1, 2].forEach(num => {
                feed.insertAdjacentHTML('beforeend', `
                    <div class="post static-post" id="bottom-static-${num}">
                        <div class="image-container"><img src="${num}.png" alt="Static"></div>
                    </div>
                `);
            });

            feed.insertAdjacentHTML('beforeend', `
                <div class="support-wrapper">
                    <a href="https://t.me/ettoveracult?direct" target="_blank" class="support-btn">SUPPORT</a>
                    <a href="https://t.me/cultclubchatroom" target="_blank" class="chat-btn">CHAT</a>
                </div>
            `);

            if (isInitialLoad) {
                setTimeout(() => {
                    feed.scrollTo(0, feed.scrollHeight);
                    btnDown.classList.add('hidden'); 
                }, 100);
            }
        }

        loadRealPhotos(true);

        // --- ЛОГИКА УДАЛЕНИЯ (АДМИН) ---
        if (isAdmin) {
            feed.addEventListener('touchstart', (e) => {
                const img = e.target.closest('.dynamic-img');
                if (!img) return;
                e.preventDefault(); 
                startDeleteTimer(img);
            }, { passive: false });

            feed.addEventListener('touchend', (e) => {
                clearTimeout(pressTimer);
                const img = e.target.closest('.dynamic-img');
                if (img) img.classList.remove('long-pressing');
            });

            feed.addEventListener('touchmove', (e) => {
                clearTimeout(pressTimer);
                const img = e.target.closest('.dynamic-img');
                if (img) img.classList.remove('long-pressing');
            }, { passive: true });

            feed.addEventListener('mousedown', (e) => {
                const img = e.target.closest('.dynamic-img');
                if (!img) return;
                startDeleteTimer(img);
            });

            feed.addEventListener('mouseup', (e) => {
                clearTimeout(pressTimer);
                const img = e.target.closest('.dynamic-img');
                if (img) img.classList.remove('long-pressing');
            });
        }

        function startDeleteTimer(img) {
            img.classList.add('long-pressing');
            pressTimer = setTimeout(() => {
                isLongPress = true;
                const post = img.closest('.post');
                postToDelete = post.dataset.id;
                document.getElementById('deleteConfirmModal').classList.add('active');
                if (navigator.vibrate) navigator.vibrate(50);
            }, 800);
        }

        function closeDeleteConfirm() {
            document.getElementById('deleteConfirmModal').classList.remove('active');
            postToDelete = null;
        }

        async function confirmDelete() {
            if (!postToDelete) return;
            
            const postElement = document.getElementById(`post-${postToDelete}`);
            if (postElement) {
                postElement.classList.add('deleting');
                
                try {
                    const res = await fetch('/api/delete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ photoId: postToDelete })
                    });

                    if (res.ok) {
                        setTimeout(() => {
                            postElement.remove();
                            closeDeleteConfirm();
                        }, 300);
                    } else {
                        alert('Ошибка удаления с сервера');
                        postElement.classList.remove('deleting');
                    }
                } catch (err) {
                    alert('Ошибка сети при удалении');
                    postElement.classList.remove('deleting');
                }
            }
        }

        // --- ОСТАЛЬНАЯ ЛОГИКА ---
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                loadRealPhotos(false); 
            }
        });

        setTimeout(() => {
            const topMask = document.querySelector('.blur-mask-top');
            const bottomMask = document.querySelector('.blur-mask-bottom');
            if (topMask) topMask.style.transform = 'translateZ(0)';
            if (bottomMask) bottomMask.style.transform = 'translateZ(0)';
        }, 100);

        feed.addEventListener('scroll', () => {
            logo.classList.add('shrunk');
            bottomControls.classList.add('shrunk');
            btnDown.classList.remove('hidden');
            
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                logo.classList.remove('shrunk');
                bottomControls.classList.remove('shrunk');
            }, 200);

            clearTimeout(hideArrowTimeout);
            hideArrowTimeout = setTimeout(() => btnDown.classList.add('hidden'), 1000);
        });

        function scrollToBottom() {
            btnDown.classList.add('hidden');
            feed.scrollTo({
                top: feed.scrollHeight,
                behavior: 'smooth'
            });
        }

        function openTelegramLink(tag) {
            let username = tag.trim().replace(/@/g, '');
            const url = `https://t.me/${username}`;
            
            if (tg && tg.openLink) {
                tg.openLink(url);
            } else {
                window.open(url, '_blank');
            }
        }

        function openModal(id) {
            bottomControls.classList.add('hidden');
            document.body.classList.add('modal-open');
            const modal = document.getElementById(id);
            
            const content = modal.querySelector('.modal-content');
            if (content) content.style.transform = '';

            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);
        }

        function closeModal(e, id) {
            if (e.target === document.getElementById(id) || !e.target) {
                const modal = document.getElementById(id);
                const content = modal.querySelector('.modal-content');
                
                modal.classList.remove('active');
                document.body.classList.remove('modal-open');
                btnBackFloating.classList.remove('active');
                
                setTimeout(() => {
                    modal.style.display = 'none';
                    if (content) content.style.transform = '';
                    
                    bottomControls.classList.remove('hidden');
                }, 400);
            }
        }

        // --- СВАЙПЫ ---
        let touchStartY = 0;
        let currentTouchModal = null;

        document.addEventListener('touchstart', (e) => {
            const dragArea = e.target.closest('.modal-drag-area');
            if (dragArea) {
                currentTouchModal = dragArea.closest('.modal-content');
                touchStartY = e.touches[0].clientY;
            }
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            if (!currentTouchModal) return;
            const deltaY = e.touches[0].clientY - touchStartY;
            
            if (deltaY > 0) {
                if (e.cancelable) e.preventDefault(); 
                currentTouchModal.style.transform = `translateY(${deltaY}px)`;
            }
        }, { passive: false }); 

        document.addEventListener('touchend', (e) => {
            if (!currentTouchModal) return;
            const deltaY = e.changedTouches[0].clientY - touchStartY;
            
            if (deltaY > 100) {
                const modal = currentTouchModal.closest('.modal-overlay');
                if (modal) closeModal({ target: modal }, modal.id);
            } else {
                currentTouchModal.style.transform = '';
            }
            currentTouchModal = null;
        });

        // --- ПОИСК С АЛФАВИТОМ ---
        function openSearchModal() {
            const tagsList = document.getElementById('tagsList');
            const uniqueTags = [...new Set(allPostsData.map(p => p.tag))].sort();
            
            tagsList.innerHTML = '';
            let currentLetter = '';

            uniqueTags.forEach(tag => {
                const count = allPostsData.filter(p => p.tag === tag).length;
                const letter = tag.replace('@', '').charAt(0).toUpperCase();
                const isTagLiked = likedTags.includes(tag);

                if (letter !== currentLetter) {
                    currentLetter = letter;
                    tagsList.innerHTML += `<div class="alphabet-header">${letter}</div>`;
                }

                tagsList.innerHTML += `
                    <div class="tag-item">
                        <div class="tag-info" onclick="showTagPhotos('${tag}')">
                            <span class="tag-name">${tag}</span>
                            <span class="tag-count">${count} фото</span>
                        </div>
                        <div class="tag-actions">
                            <button class="action-btn like-btn ${isTagLiked ? 'liked' : ''}" onclick="event.stopPropagation(); toggleTagLike(event, '${tag}')">
                                <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                            </button>
                            <button class="action-btn profile-btn" onclick="event.stopPropagation(); openTelegramLink('${tag}')">
                                <svg viewBox="0 0 24 24">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <circle cx="12" cy="9" r="3"></circle>
                                    <path d="M6.5 18.5c1.5-2 3.5-3 5.5-3s4 1 5.5 3"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('tagsView').style.display = 'block';
            document.getElementById('gridView').style.display = 'none';
            document.getElementById('searchTitle').innerText = 'Поиск по тегам';
            btnBackFloating.classList.remove('active');
            openModal('searchModal');
        }

        function showTagPhotos(tag) {
            const authorGrid = document.getElementById('authorGrid');
            authorGrid.innerHTML = '';
            allPostsData.filter(p => p.tag === tag).forEach(photo => {
                authorGrid.innerHTML += `
                    <div class="grid-item" onclick="scrollToPost('${photo.id}', 'searchModal')">
                        <img src="${photo.img}">
                    </div>
                `;
            });
            document.getElementById('tagsView').style.display = 'none';
            document.getElementById('gridView').style.display = 'block';
            document.getElementById('searchTitle').innerText = tag;
            btnBackFloating.classList.add('active');
        }

        function showTagsList() {
            document.getElementById('tagsView').style.display = 'block';
            document.getElementById('gridView').style.display = 'none';
            document.getElementById('searchTitle').innerText = 'Поиск по тегам';
            btnBackFloating.classList.remove('active');
        }

        function scrollToPost(id, modalId) {
            closeModal({ target: document.getElementById(modalId) }, modalId);
            setTimeout(() => {
                const post = document.getElementById(`post-${id}`);
                if (post) post.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 500);
        }

        // --- ЛАЙКИ ФОТО ---
        async function toggleLike(e, postId) {
            e.stopPropagation();
            const btn = e.currentTarget;
            const idAsNumber = parseInt(postId);
            btn.disabled = true;

            if (likedPhotos.includes(idAsNumber)) {
                const { error } = await supabaseClient
                    .from('likes')
                    .delete()
                    .eq('photo_id', idAsNumber)
                    .eq('user_id', currentUserId);

                if (!error) {
                    likedPhotos = likedPhotos.filter(id => id !== idAsNumber);
                    btn.classList.remove('liked');
                }
            } else {
                const { error } = await supabaseClient
                    .from('likes')
                    .insert([{ photo_id: idAsNumber, user_id: currentUserId }]);

                if (!error) {
                    likedPhotos.push(idAsNumber);
                    btn.classList.add('liked');
                }
            }
            btn.disabled = false;
        }

        // --- ЛАЙКИ ТЕГОВ ---
        async function toggleTagLike(e, tag) {
            e.stopPropagation();
            const btn = e.currentTarget;
            btn.disabled = true;

            if (likedTags.includes(tag)) {
                const { error } = await supabaseClient
                    .from('likes')
                    .delete()
                    .eq('tag', tag)
                    .eq('user_id', currentUserId);

                if (!error) {
                    likedTags = likedTags.filter(t => t !== tag);
                    btn.classList.remove('liked');
                } else {
                    console.error("Ошибка удаления тега:", error);
                }
            } else {
                const { error } = await supabaseClient
                    .from('likes')
                    .insert([{ tag: tag, user_id: currentUserId }]);

                if (!error) {
                    likedTags.push(tag);
                    btn.classList.add('liked');
                } else {
                    console.error("Ошибка добавления тега:", error);
                }
            }
            btn.disabled = false;
        }

        function openLikesModal() {
            const likesGrid = document.getElementById('likesGrid');
            likesGrid.innerHTML = '';
            
            const uniqueLikedIds = [...new Set(likedPhotos)];

            if (uniqueLikedIds.length === 0) {
                likesGrid.innerHTML = `<p style="grid-column: span 3; text-align: center; color: #888;">Пока пусто</p>`;
            } else {
                uniqueLikedIds.forEach(id => {
                    const photo = allPostsData.find(p => p.id.toString() === id.toString());
                    if (photo) {
                        likesGrid.innerHTML += `
                            <div class="grid-item" onclick="scrollToPost('${id}', 'likesModal')">
                                <img src="${photo.img}">
                            </div>
                        `;
                    }
                });
            }
            openModal('likesModal');
        }

        // --- ОТПРАВКА ФОТО ---
        function handleFileSelect(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.getElementById('compressCanvas');
                        const ctx = canvas.getContext('2d');
                        let width = img.width, height = img.height;
                        const MAX_SIZE = 1080;
                        if (width > height && width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                        else if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                        canvas.width = width; canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        canvas.toBlob(function(blob) {
                            currentFileToUpload = new File([blob], "photo.jpg", { type: "image/jpeg" });
                            previewImage.src = URL.createObjectURL(blob);
                            previewImage.style.display = 'block';
                            document.getElementById('uploadText').innerText = 'Файл готов';
                            document.getElementById('uploadIcon').style.display = 'none';
                        }, 'image/jpeg', 0.8);
                    }
                    img.src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        async function submitPhoto() {
            const tagInput = document.getElementById('tagInput').value;
            if (!currentFileToUpload) { alert("Выберите файл!"); return; }
            if (tagInput === '@') { alert("Введите тег!"); return; }

            const formData = new FormData();
            formData.append('photo', currentFileToUpload);
            formData.append('tag', tagInput);

            const btn = document.querySelector('.btn-submit');
            btn.innerText = 'Отправка...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/submit', { method: 'POST', body: formData });
                if (res.ok) {
                    alert('Файл успешно отправлен на модерацию!');
                    document.getElementById('fileInput').value = '';
                    previewImage.style.display = 'none';
                    previewImage.src = '';
                    document.getElementById('uploadText').innerText = 'Нажмите, чтобы выбрать файл';
                    document.getElementById('uploadIcon').style.display = 'flex';
                    currentFileToUpload = null;
                    closeModal({target: submitModal}, 'submitModal');
                } else {
                    const data = await res.json();
                    alert('Ошибка: ' + data.error);
                }
            } catch (err) {
                alert('Ошибка сети');
            } finally {
                btn.innerText = 'Отправить';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
