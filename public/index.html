<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cult • Club Gallery</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --secondary-text: #888888;
            --border: rgba(0, 0, 0, 0.1);
            --fill-1: rgba(0, 0, 0, 0.05);
            --fill-2: rgba(0, 0, 0, 0.03);
            --fill-3: rgba(0, 0, 0, 0.015);
            --btn-bg: rgba(255, 255, 255, 0.7);
            --btn-shadow: rgba(0, 0, 0, 0.1);
            --icon-color: #000000;
            --icon-muted: rgba(0, 0, 0, 0.4);
            --mask-bg: rgba(255, 255, 255, 0.01);
            --modal-bg: rgba(255, 255, 255, 0.98);
            --smooth-ease: cubic-bezier(0.25, 1, 0.5, 1);
            --smooth-duration: 0.6s;
            --like-color: #000000;
            --font-main: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            --skeleton-bg: #e0e0e0;
            --skeleton-shimmer: #f5f5f5;
            --red: #000000;
            --orange: #000000;
            --yellow: #000000;
            --green: #000000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color); color: var(--text-color);
            overflow: hidden; position: fixed; width: 100%; height: 100%;
            user-select: none; -webkit-font-smoothing: antialiased; overscroll-behavior: none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .blur-mask-top { position: fixed; top: 0; left: 0; right: 0; height: 180px; z-index: 150; pointer-events: none; background: var(--mask-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); -webkit-mask-image: linear-gradient(to bottom, black 10%, transparent 90%); mask-image: linear-gradient(to bottom, black 10%, transparent 90%); transform: translateZ(0); will-change: backdrop-filter; }
        .blur-mask-bottom { position: fixed; bottom: 0; left: 0; right: 0; height: 200px; z-index: 90; pointer-events: none; background: var(--mask-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); -webkit-mask-image: linear-gradient(to top, black 10%, transparent 90%); mask-image: linear-gradient(to top, black 10%, transparent 90%); transform: translateZ(0); will-change: backdrop-filter; }

        .floating-logo { position: fixed; top: 15px; left: 50%; transform: translateX(-50%) scale(1); z-index: 9999; pointer-events: none; width: 47%; max-width: 250px; transition: transform var(--smooth-duration) var(--smooth-ease), opacity 0.3s ease; opacity: 1; }
        .floating-logo img { width: 100%; height: auto; object-fit: contain; filter: drop-shadow(0px 0px 8px rgba(255, 255, 255, 0.15)) drop-shadow(0px 0px 16px rgba(255, 255, 255, 0.08)) drop-shadow(0px 0px 24px rgba(255, 255, 255, 0.03)) drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2)); transition: filter 0.3s ease; }
        .floating-logo.shrunk { transform: translateX(-50%) scale(0.95); }
        body.modal-open .floating-logo img { filter: blur(10px) drop-shadow(0 8px 16px rgba(0,0,0,0.4)); }
        .floating-logo.hide { opacity: 0; transform: translateX(-50%) scale(0.9); pointer-events: none; }
        .floating-logo-pc { display: none; }

        .feed { height: 100vh; overflow-y: scroll; padding-top: 80px; padding-bottom: 100px; display: flex; flex-direction: column; align-items: center; padding-left: 7px; padding-right: 7px; scrollbar-width: none; -ms-overflow-style: none; transition: filter 0.3s ease; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; position: relative; }
        .feed::-webkit-scrollbar { width: 0px; display: none; }
        body.modal-open .feed { filter: blur(10px); }

        .post { width: 100%; max-width: 500px; margin-bottom: 30px; display: flex; flex-direction: column; position: relative; }
        .image-container { position: relative; width: 100%; touch-action: pan-y; }
        .post img { width: 100%; height: auto; max-height: none; object-fit: contain; background-color: var(--fill-1); border-radius: 8px; display: block; }

        .post.last-published { position: relative; }
        .post.last-published .image-container { position: relative; border-radius: 8px; }

        .skeleton-loading { width: 100%; max-width: 500px; height: 400px; border-radius: 8px; margin-bottom: 30px; background: linear-gradient(90deg, var(--skeleton-bg) 25%, var(--skeleton-shimmer) 50%, var(--skeleton-bg) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        .double-tap-heart { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); width: 80px; height: 80px; z-index: 10; pointer-events: none; opacity: 0; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s ease; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3)); }
        .double-tap-heart svg { width: 100%; height: 100%; fill: var(--like-color); stroke: white; stroke-width: 2; }
        .double-tap-heart.animate { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        .double-tap-heart.fade-out { transform: translate(-50%, -50%) scale(1.5); opacity: 0; transition: transform 0.4s ease, opacity 0.4s ease; }

        .action-btn { width: 40px; height: 40px; background: var(--btn-bg); border: 1px solid var(--border); box-shadow: 0 2px 5px var(--btn-shadow); border-radius: 50%; position: relative; cursor: pointer; transition: transform 0.2s ease; flex-shrink: 0; }
        .action-btn svg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: block; }
        .profile-btn svg { width: 22px; height: 22px; fill: #000 !important; color: #000 !important; stroke: none; transition: stroke 0.2s, fill 0.2s; }
        .like-btn svg { width: 19px; height: 19px; stroke: var(--icon-color); stroke-width: 2; fill: transparent; transition: stroke 0.2s, fill 0.2s; }
        
        .comment-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--btn-bg); border: 1px solid var(--border); box-shadow: 0 2px 5px var(--btn-shadow); display: flex; justify-content: center; align-items: center; cursor: pointer; transition: transform 0.2s ease; flex-shrink: 0; color: var(--icon-muted); padding: 0; line-height: 1; }
        .comment-btn svg { width: 18px; height: 18px; display: block; fill: currentColor; flex: none; }

        .action-btn:active, .comment-btn:active { transform: scale(0.85); }
        .like-btn.liked svg { stroke: var(--like-color); fill: var(--like-color); }

        .post-info { display: flex; align-items: center; padding-top: 15px; padding-left: 7px; padding-right: 7px; font-size: 13px; font-weight: 400; letter-spacing: -0.2px; position: relative; z-index: 100; width: 100%; gap: 0; }
        .info-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
        .tag-wrapper { flex: 1; min-width: 0; overflow: hidden; display: flex; align-items: center; -webkit-mask-image: linear-gradient(to right, black 80%, transparent 100%); mask-image: linear-gradient(to right, black 80%, transparent 100%); }
        .post-tag { color: var(--text-color); text-decoration: none; font-weight: 500; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; padding-bottom: 2px; display: inline-block; }
        
        .info-middle { display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 0 10px; }
        .info-right { display: flex; align-items: center; flex: 1; min-width: 0; justify-content: flex-end; }
        .post-date { color: var(--secondary-text); font-size: 13px; white-space: nowrap; flex-shrink: 0; margin-right: 10px; }
        .like-count { font-size: 12px; color: var(--secondary-text); font-weight: 500; margin-left: 10px; white-space: nowrap; min-width: 15px; text-align: left; flex-shrink: 0; }
        .tag-item .like-count { margin-right: 8px; margin-left: 0; }

        .bottom-controls { position: fixed; bottom: 30px; left: 50%; width: min(calc(100vw - 14px), 500px); height: 65px; transform: translateX(-50%) translateY(0) scale(1); z-index: 100; display: flex; align-items: center; justify-content: flex-start; gap: 0; transition: opacity 0.4s var(--smooth-ease), transform 0.4s var(--smooth-ease), visibility 0s linear 0s; opacity: 1; visibility: visible; pointer-events: auto; }
        .bottom-controls.hidden { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(20px) scale(0.9); visibility: hidden; transition: opacity 0.4s var(--smooth-ease), transform 0.4s var(--smooth-ease), visibility 0s linear 0.4s; }
        .bottom-controls.scrolling, .btn-pulse-down.scrolling, .btn-pulse-up.scrolling { pointer-events: none !important; }

        .liquid-glass { background: var(--btn-bg); border: 1px solid var(--border); box-shadow: 0 4px 10px var(--btn-shadow); border-radius: 50%; position: relative; cursor: pointer; transition: transform var(--smooth-duration) var(--smooth-ease), background 0.3s ease, border 0.3s ease; }
        .liquid-glass svg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: block; width: 24px; height: 24px; stroke: var(--icon-color); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: 0.8; }

        /* Три основные кнопки закреплены в центре экрана и не зависят от ширины кнопки профиля. */
        .bottom-actions { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; gap: 12px; width: max-content; }
        .btn-search, .btn-likes { width: 50px; height: 50px; flex: 0 0 50px; }
        .btn-add { width: 65px; height: 65px; flex: 0 0 65px; }
        .bottom-controls.shrunk .btn-search, .bottom-controls.shrunk .btn-likes { transform: scale(0.85); }
        .bottom-controls.shrunk .btn-add { transform: scale(0.85); }

        /* Профиль — flex-элемент слева; заполняет только доступный промежуток до центральной группы. */
        .profile-floating { position: relative; left: auto; right: auto; bottom: auto; width: auto; min-width: 0; max-width: none; height: 50px; flex: 0 1 calc(50% - 106.5px); margin-right: 12px; z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 1; visibility: visible; pointer-events: auto; background: var(--btn-bg); border: 1px solid var(--border); border-radius: 28px; box-shadow: 0 4px 10px var(--btn-shadow); color: var(--text-color); font-family: inherit; font-size: clamp(6px, 3vw, 13px); font-weight: 600; line-height: 1; white-space: nowrap; padding: 0 3px; overflow: hidden; text-align: center; }
        .profile-floating { transition: transform var(--smooth-duration) var(--smooth-ease), opacity .35s var(--smooth-ease), visibility 0s linear 0s, background .3s ease, border .3s ease; }
        .profile-floating:active { transform: scale(.98); }
        .profile-floating.hidden { opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(15px) scale(.8); transition: transform var(--smooth-duration) var(--smooth-ease), opacity .35s var(--smooth-ease), visibility 0s linear .35s; }
        .profile-floating.shrunk { transform: scale(.85); }
        .btn-pulse-down.shrunk, .btn-pulse-up.shrunk { animation-play-state: paused; }
        @media (max-width: 380px) {
            .bottom-actions { gap: 7px; }
            .btn-search, .btn-likes { width: 44px; height: 44px; flex-basis: 44px; }
            .btn-add { width: 58px; height: 58px; flex-basis: 58px; }
            .profile-floating { height: 44px; flex-basis: calc(50% - 87px); font-size: clamp(5px, 3vw, 11px); margin-right: 7px; }
        }
        @media (max-width: 260px) {
            .bottom-actions { gap: 5px; }
            .btn-search, .btn-likes { width: 40px; height: 40px; flex-basis: 40px; }
            .btn-add { width: 52px; height: 52px; flex-basis: 52px; }
            .profile-floating { height: 40px; flex-basis: calc(50% - 76px); font-size: clamp(4px, 2.9vw, 7px); padding: 0 2px; margin-right: 5px; }
        }

        .btn-pulse-down, .btn-pulse-up { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(0) scale(1); width: 65px; height: 65px; background: var(--btn-bg); border: 1px solid var(--border); box-shadow: 0 4px 10px var(--btn-shadow); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; pointer-events: auto; animation: pulseWhole 2s ease-in-out infinite; opacity: 1; visibility: visible; transition: opacity 0.35s var(--smooth-ease), transform 0.35s var(--smooth-ease), visibility 0s linear 0s; z-index: 99; }
        .btn-pulse-down.hidden, .btn-pulse-up.hidden { opacity: 0; visibility: hidden; pointer-events: none; animation-play-state: paused; transition: opacity 0.35s var(--smooth-ease), transform 0.35s var(--smooth-ease), visibility 0s linear 0.35s; }
        .btn-pulse-down svg, .btn-pulse-up svg { width: 24px; height: 24px; stroke: var(--icon-color); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: 0.8; display: block; }
        @keyframes pulseWhole { 0%, 100% { transform: translateX(-50%) translateY(0) scale(1); } 50% { transform: translateX(-50%) translateY(-8px) scale(1); } }

        .btn-down { position: fixed; bottom: 37px; right: max(7px, calc((100vw - 500px) / 2)); width: calc(min(100vw - 14px, 500px) / 2 - 106.5px); min-width: 0; height: 50px; border-radius: 28px; z-index: 100; transition: transform var(--smooth-duration) var(--smooth-ease), opacity 0.35s var(--smooth-ease), visibility 0.35s; background: var(--text-color); border: 1px solid var(--border); display: flex; justify-content: center; align-items: center; }
        .btn-down svg { display: block; margin: auto; stroke: var(--bg-color); width: 24px; height: 24px;}
        .btn-down.shrunk { transform: scale(.85); }
        @media (max-width: 380px) { .btn-down { width: calc(min(100vw - 14px, 500px) / 2 - 87px); height: 44px; } }
        @media (max-width: 260px) { .btn-down { width: calc(min(100vw - 14px, 500px) / 2 - 76px); height: 40px; } }
        .btn-down.hidden { opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(15px) scale(0.8); }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.2); display: none; justify-content: center; align-items: flex-end; z-index: 200; opacity: 0; transition: opacity 0.4s ease; overscroll-behavior: contain; }
        .modal-overlay.active { display: flex; opacity: 1; }
        #profileModal { z-index: 220; }
        #searchModal { z-index: 230; }
        .modal-overlay, .modal-content, .modal-body { overscroll-behavior: contain; }
        .modal-content { touch-action: pan-y; -webkit-overflow-scrolling: touch; }
        .modal-body { touch-action: pan-y; }

        /* Парящая строка поиска профилей — теперь только в профиле */
        .profile-search-float { position:absolute; z-index:223; left:50%; bottom:calc(70vh + 12px); transform:translate(-50%, 12px); width:calc(100% - 28px); max-width:460px; opacity:0; visibility:hidden; pointer-events:none; transition:opacity .35s var(--smooth-ease), transform .45s var(--smooth-ease), visibility 0s linear .35s; }
        #profileModal.active .profile-search-float { opacity:1; visibility:visible; pointer-events:auto; transform:translate(-50%, 0); transition-delay:0s; }
        .profile-search-input-wrap { display:flex; align-items:center; gap:9px; padding:11px 15px; border:1px solid var(--border); border-radius:18px; background:var(--modal-bg); box-shadow:0 8px 28px rgba(0,0,0,.16); }
        .profile-search-input-wrap svg { width:19px; height:19px; flex-shrink:0; stroke:var(--secondary-text); fill:none; stroke-width:2; }
        .profile-search-input { width:100%; border:0; outline:0; background:transparent; color:var(--text-color); font:inherit; font-size:14px; }
        .profile-search-results { display:none; max-height:32vh; overflow:auto; margin-top:7px; padding:5px; border:1px solid var(--border); border-radius:15px; background:var(--modal-bg); box-shadow:0 8px 28px rgba(0,0,0,.16); }
        .profile-search-results.open { display:block; animation:profileSearchIn .22s ease both; }
        .profile-search-result { display:flex; align-items:center; width:100%; gap:10px; padding:10px; border:0; border-radius:10px; background:transparent; color:var(--text-color); text-align:left; cursor:pointer; }
        .profile-search-result:active { background:var(--fill-1); }
        .profile-search-result strong { display:block; font-size:13px; }
        .profile-search-result small { display:block; color:var(--secondary-text); font-size:12px; margin-top:2px; }
        .profile-search-avatar { width:34px; height:34px; border-radius:50%; object-fit:cover; background:var(--fill-1); flex-shrink:0; }
        @keyframes profileSearchIn { from {opacity:0; transform:translateY(-5px) scale(.98)} to {opacity:1; transform:translateY(0) scale(1)} }
        @media (max-height:650px) { .profile-search-float { bottom:calc(70vh + 8px); } }

        .modal-content { background: var(--modal-bg); border-top: 1px solid var(--border); width: 100%; max-width: 500px; border-radius: 24px 24px 0 0; height: 70vh; display: flex; flex-direction: column; transform: translateY(100%); opacity: 0; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease; box-shadow: 0 -10px 40px rgba(0,0,0,0.15); position: relative; z-index: 201; overflow: hidden; }
        .modal-overlay.active .modal-content { transform: translateY(0); opacity: 1; }
        .modal-drag-area { padding: 30px 20px 15px; flex-shrink: 0; cursor: grab; position: relative; touch-action: none; display: flex; align-items: center; justify-content: center; }
        .modal-content::before { content: ''; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 40px; height: 4px; background: var(--fill-1); border-radius: 2px; }
        .modal-body { flex: 1; overflow-y: auto; padding: 0 20px 80px; overscroll-behavior: contain; display: flex; flex-direction: column; }
        .modal-body::-webkit-scrollbar { width: 0px; display: none; }
        .modal-body { scrollbar-width: none; -ms-overflow-style: none; }
        .modal-title { font-size: 18px; font-weight: 600; text-align: center; color: var(--text-color); margin: 0; }

        .auth-modal .modal-body { gap: 12px; justify-content: space-between; align-items: center; padding-top: 5px; padding-bottom: 20px; }
        .auth-subtitle { font-size: 13px; color: var(--secondary-text); text-align: center; line-height: 1.4; padding: 0 10px; margin-bottom: 5px; }
        .auth-input { width: 100%; padding: 16px; border: 1px solid var(--border); background: var(--fill-2); border-radius: 14px; font-size: 16px; outline: none; font-family: inherit; flex-shrink: 0; color: var(--text-color); }
        .auth-input::placeholder { color: var(--secondary-text); }
        
        .password-wrapper { position: relative; width: 100%; }
        .password-wrapper .auth-input { padding-right: 48px; }
        .eye-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border: none; background: transparent; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .eye-btn svg { width: 20px; height: 20px; fill: none; stroke: var(--secondary-text); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        
        .pw-strength-wrap { display: none; flex-direction: column; gap: 6px; margin-top: 4px; width: 100%; }
        .pw-strength-bars { display: flex; gap: 6px; height: 4px; width: 100%; }
        .pw-strength-bars i { flex: 1; height: 100%; border-radius: 2px; background: var(--fill-1); overflow: hidden; }
        .pw-strength-bars i b { display: block; height: 100%; width: 0%; border-radius: 2px; transition: width 0.3s ease, background-color 0.3s ease; }
        .pw-strength-text { font-size: 12px; color: var(--secondary-text); font-weight: 500; }
        
        .auth-btn { width: 100%; padding: 16px; background: var(--text-color); color: var(--bg-color); border: none; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; font-family: inherit; flex-shrink: 0; transition: opacity 0.2s; text-transform: uppercase; margin-top: auto; margin-bottom: 0; }
        .auth-btn:active { opacity: 0.8; }

        #submitModal .modal-content { height: 85vh; }
        #submitModal .modal-body { gap: 12px; justify-content: flex-start; padding-bottom: 20px; }
        
        /* Обновленное окно комментариев */
        #commentsModal .modal-content { height: 70vh; }
        #commentsModal .modal-body { justify-content:flex-start; padding:0 20px 12px; overflow:hidden; min-height:0; }
        #commentsModal #commentModalBody { display:flex; flex-direction:column; flex:1 1 auto; min-height:0; height:100%; gap:0; }
        #commentsModal #commentsList { order:1; flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; padding:2px 2px 12px 0; }
        #commentsModal .add-comment-box { order:2; flex:0 0 auto; margin:10px 0 0; padding:10px 0 0; border-bottom:0; border-top:1px solid var(--border); background:var(--modal-bg); }
        #commentsModal .add-comment-input { max-height:110px; min-height:54px; }
        #commentsModal .add-comment-btn { flex:0 0 auto; }

        /* Парящий блок описания поста (над окном комментариев) */
        .floating-post-desc {
            position: absolute;
            left: 50%;
            bottom: calc(70vh + 12px);
            transform: translate(-50%, 12px);
            width: calc(100% - 28px);
            max-width: 460px;
            background: var(--modal-bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 14px;
            box-shadow: 0 8px 28px rgba(0,0,0,.16);
            display: flex;
            flex-direction: column;
            gap: 6px;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity .35s var(--smooth-ease), transform .45s var(--smooth-ease), visibility 0s linear .35s;
            z-index: 223;
            /* Ограничение: блок не выходит за верх экрана */
            max-height: calc(100vh - 70vh - 40px);
        }
        #commentsModal.active .floating-post-desc {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translate(-50%, 0);
            transition-delay: 0s;
        }
        .floating-desc-tag {
            font-size: 12px;
            color: var(--secondary-text);
            font-weight: 500;
            flex-shrink: 0;
        }
        .floating-desc-text {
            font-size: 14px;
            color: var(--text-color);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
            transition: max-height 0.35s var(--smooth-ease);
            max-height: calc(3 * 1.4 * 14px);
        }
        .floating-desc-text.expanded {
            display: block;
            -webkit-line-clamp: unset;
            -webkit-box-orient: initial;
            overflow-y: auto;
            max-height: calc(100vh - 70vh - 120px);
            padding-right: 4px;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }
        .floating-desc-text.expanded::-webkit-scrollbar { width: 4px; }
        .floating-desc-text.expanded::-webkit-scrollbar-thumb { background: var(--fill-1); border-radius: 2px; }

        /* =====================================================================

        .panel-close-btn { display: none; }

        @media (min-width: 1100px) {
            :root {

                --lrail-l: calc(var(--grp-l) + var(--side-w) + var(--gap));
                --feed-l: calc(var(--lrail-l) + var(--rail-w) + var(--gap));
                --rail-l: calc(var(--feed-l) + var(--feed-w) + var(--gap));

            /* Лента */

            /* Логотип над лентой — абсолютно та же механика, что на телефоне (hide / shrunk из скролла),
               но только когда меню свёрнуто. Пока меню развёрнуто — над лентой его нет, лого стоит над профилем. */
            #logo { top: 15px; bottom: auto; left: calc(var(--feed-l) + var(--feed-w) / 2); }

            /* Логотип над профилем: пропадает вместе с меню при сворачивании, при наведении слегка увеличивается как кнопки */
            .floating-logo-pc { display: block; top: 15px; bottom: auto; left: calc(var(--grp-l) + var(--side-w) / 2); pointer-events: auto; opacity: 1; visibility: visible; transform: translateX(-50%) scale(1); transition: transform .4s var(--smooth-ease), opacity .4s var(--smooth-ease), visibility 0s linear 0s; }

            /* Блюр сверху и снизу — как на телефоне, в пределах ленты */
            .blur-mask-top, .blur-mask-bottom { left: var(--feed-l); right: auto; width: var(--feed-w); }

            /* Кнопки меню — справа от ленты, те же механики появления/скрытия, что и на телефоне */

            .bottom-controls { left: var(--rail-l); top: 50%; bottom: auto; width: var(--rail-w); height: auto; transform: translateY(-50%) scale(1); flex-direction: column; align-items: center; justify-content: center; }

            /* Кнопка «наверх» — в колонке кнопок меню; стрелки у чата — по центру ленты */
            .btn-down { left: calc(var(--rail-l) + (var(--rail-w) - 54px) / 2); right: auto; bottom: 40px; width: 54px; height: 54px; border-radius: 50%; }

            /* Служебные кнопки окон (назад / сортировка / избранные теги) — внизу правой панели */
            .btn-back-floating, .btn-sort-floating, .btn-fav-tags-floating { left: calc(var(--rwin-l) + var(--side-w) / 2); bottom: calc(var(--panel-bottom) + 16px); }

            .grid-item:hover { opacity: .88; }

            /* Кнопка смены отображения ленты — по центру между профилем и лентой, отступы как у кнопок меню */
            .btn-panels-toggle { display: flex; align-items: center; justify-content: center; position: fixed; left: calc(var(--lrail-l) + (var(--rail-w) - 54px) / 2); top: 50%; width: 54px; height: 54px; padding: 0; box-sizing: border-box; transform: translateY(-50%) scale(1); z-index: 450; opacity: 1; visibility: visible; transition: opacity .4s var(--smooth-ease), transform .4s var(--smooth-ease), visibility 0s linear 0s, background .3s ease, border .3s ease; }
            .btn-panels-toggle svg { position: static; top: auto; left: auto; transform: none; margin: 0; flex: none; }
            .btn-panels-toggle:active { transform: translateY(-50%) scale(.95); }
            @media (hover: hover) { .btn-panels-toggle:hover { transform: translateY(-50%) scale(1.07); } }

    <script>

        const tg = window.Telegram.WebApp;

        const supabaseUrl = 'https://asoljhfvsrxmeniwsvel.supabase.co';

        const logo = document.getElementById('logo');

        let currentUser = null;
        let allPostsData = []; 
        let likedPhotos = []; 
        let likedTags = [];
        let allLikesCache = [];
        let tagProfileOwners = {}; 
        let currentFileToUpload = null;
        let isLikesSortedAsc = false; 
        let isFavoriteTagsView = false; 
        const desktopMQ = window.matchMedia('(min-width: 1100px)');
        function isDesktop() { return desktopMQ.matches; }
        const DESKTOP_RIGHT_WINDOWS = ['submitModal', 'searchModal', 'likesModal', 'commentsModal', 'chainsawModal'];
        let panelsCollapsed = false;
        let searchGridReturn = 'tags'; // куда возвращает «назад» из сетки: 'tags' (все теги) или 'favorites'
        function setFloating(which) {
            btnBackFloating.classList.toggle('active', which === 'back');
            btnFavTagsFloating.classList.toggle('active', which === 'fav');
            btnSortFloating.classList.toggle('active', which === 'sort');
        }
        // Восстанавливает нужную кнопку по текущему состоянию открытого окна (например, после закрытия профиля поверх поиска)
        function restoreFloatingButtons() {
            const searchEl = document.getElementById('searchModal');
            const likesEl = document.getElementById('likesModal');
            if (searchEl && searchEl.classList.contains('active')) {
                const gridShown = document.getElementById('gridView').style.display === 'block';
                setFloating(gridShown || isFavoriteTagsView ? 'back' : 'fav');
            } else if (likesEl && likesEl.classList.contains('active')) setFloating('sort');
            else setFloating(null);
        }
        function setPanelsCollapsed(v) {
            panelsCollapsed = !!v;
            document.body.classList.toggle('panels-collapsed', panelsCollapsed);
            const b = document.getElementById('btnPanelsToggle');
            if (b) b.setAttribute('aria-pressed', String(panelsCollapsed));
        }
        function togglePanels() {
            if (!isDesktop()) return;
            setPanelsCollapsed(!panelsCollapsed);
        }
        let activeProfileUserId = null;
        let activeProfileTags = [];
        let viewingOtherProfile = false;
        let profileEditorOpen = false;
        let profileLoadToken = 0;
        let dockRefreshTimer = null;
        let supportButtonOffset = null; 
        
        let scrollTimeout;
        let hideArrowTimeout;
        let lastTap = 0;
        let controlsRevealTimer = null;
        let isProgrammaticScroll = false;
        let programmaticScrollEndTimer = null;

        let currentCommentPhotoId = null;
        let canEditCurrentPostDescription = false;
        let replyToId = null;
        let editingCommentId = null;
        let activeLens = null;
        let isDescExpanded = false;

        // === Утилита нормализации тега (без @/#, нижний регистр) ===
        function normalizeTagKey(tag) {
            return String(tag || '').trim().replace(/^[@#]+/, '').toLowerCase();
        }

        // === ЧТЕНИЕ ПАРАМЕТРА STARTAPP (Deep Link) ===
        // 1. Пытаемся получить из initData (самый надежный способ)
        const initDataParams = new URLSearchParams(tg.initData);
        let startParam = initDataParams.get('start_param');

        // 2. Запасной вариант: initDataUnsafe
        if (!startParam) {
            startParam = tg.initDataUnsafe?.start_param;
        }

        // 3. Запасной вариант: URL
        if (!startParam) {
            const urlParams = new URLSearchParams(window.location.search);
            startParam = urlParams.get('tgWebAppStartParam');
        }

        console.log('Final startParam:', startParam); // Для отладки (потом можно убрать)

        // Обработка Deep Link
        if (startParam && startParam.startsWith('profile_')) {
            const profileId = startParam.replace('profile_', '');
            setTimeout(() => {
                if (currentUser) {
                    openUserProfile(profileId);
                } else {
                    setTimeout(() => openUserProfile(profileId), 500);
                }
            }, 500);
        }

        // Обработка скрытия клавиатуры (показ кнопки)
        document.body.addEventListener('focusin', (e) => {
            if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') {
                document.getElementById('keyboardHideBtn').style.display = 'flex';
            }
        });
        document.body.addEventListener('focusout', (e) => {
            if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') {
                setTimeout(() => {
                    if (!document.activeElement || (document.activeElement.tagName !== 'TEXTAREA' && document.activeElement.tagName !== 'INPUT')) {
                        document.getElementById('keyboardHideBtn').style.display = 'none';
                    }
                }, 100);
            }
        });

        function hideKeyboard() {
            document.activeElement.blur();
            document.getElementById('keyboardHideBtn').style.display = 'none';
            if (tg && tg.hideKeyboard) tg.hideKeyboard();
        }

        // Утилита для парсинга Markdown-ссылок и жирного/курсива
        function parseTextLinks(text) {
            if (!text) return '';
            let safeText = escapeHtml(text);
            // Markdown [text](url)
            safeText = safeText.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
            // **bold**
            safeText = safeText.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            // _italic_
            safeText = safeText.replace(/(^|[^A-Za-z0-9])_([^_]+)_(?![A-Za-z0-9])/g, '$1<em>$2</em>');
            // Обычные URL
            safeText = safeText.replace(/(^|\s)(https?:\/\/[^\s]+)/g, '$1<a href="$2" target="_blank">$2</a>');
            return safeText;
        }

        function toggleDescExpand() {
            isDescExpanded = !isDescExpanded;
            const textEl = document.getElementById('floatingDescText');
            const btn = document.getElementById('btnExpandDesc');
            if (isDescExpanded) {
                textEl.classList.add('expanded');
                btn.innerText = 'Свернуть';
            } else {
                textEl.classList.remove('expanded');
                btn.innerText = 'Развернуть';
                // при сворачивании прокручиваем текст наверх
                textEl.scrollTop = 0;
            }
        }

        function checkAuth() {
            const savedUser = localStorage.getItem('cult_user');
            if (savedUser) currentUser = JSON.parse(savedUser);
            if (!currentUser) { likedPhotos = []; likedTags = []; }
        }
        checkAuth();
        loadRealPhotos(true);

        function handleProfileClick() {
            if (!currentUser) { openModal('authModal'); return; }
            openUserProfile(currentUser.id);
        }


        async function openUserProfile(userId, opts) {
            if (!userId) return;
            const silent = !!(opts && opts.silent);
            const myToken = ++profileLoadToken;
            activeProfileUserId = userId;
            profileEditorOpen = false;
            const desk = isDesktop();

            // Скрываем лишние кнопки при открытии профиля (на ПК окна меню остаются открытыми)
            if (!desk) {
                btnBackFloating.classList.remove('active');
                btnFavTagsFloating.classList.remove('active');
                btnSortFloating.classList.remove('active');
            }

            const profileModalEl = document.getElementById('profileModal');
            if (profileModalEl) profileModalEl.style.zIndex = '250';

            if (desk) {
                // Чужой профиль открывается слева поверх своего профиля (или окна входа)
                viewingOtherProfile = !currentUser || String(currentUser.id) !== String(userId);
                profileModalEl.classList.toggle('viewing-other', viewingOtherProfile);
                document.getElementById('authModal').classList.toggle('dock-covered', viewingOtherProfile && !currentUser);
            }

            const body = document.getElementById('profileModalBody');
            const prevScroll = silent ? body.scrollTop : 0;
            if (!silent) body.innerHTML = '<div class="profile-empty">Загрузка профиля…</div>';
            openModal('profileModal');

            const { data: account, error } = await supabaseClient.from('users').select('id, username').eq('id', userId).single();
            if (myToken !== profileLoadToken) return;
            if (error || !account) {
                body.innerHTML = '<div class="profile-empty">Не удалось загрузить профиль.</div>';
                return;
            }
            const { data: profileData, error: profileError } = await supabaseClient.from('user_profiles').select('display_name, bio, avatar_url').eq('user_id', userId).maybeSingle();
            if (myToken !== profileLoadToken) return;
            
            const profile = { ...account, ...(profileData || {}) };
            activeProfileUserId = profile.id;
            const isOwner = currentUser && String(currentUser.id) === String(profile.id);
            const tagResult = await supabaseClient.from('profile_tags').select('tag').eq('user_id', profile.id);
            if (myToken !== profileLoadToken) return;

            activeProfileTags = [...new Set((tagResult.data || []).map(x => x.tag).filter(Boolean))];
            const displayName = profile.display_name || String(profile.username || '').replace(/^@/, '') || 'Пользователь';
            const avatar = profile.avatar_url
                ? `<img class="profile-avatar" src="${escapeHtml(profile.avatar_url)}" alt="Аватар">`
                : `<div class="profile-avatar-placeholder">${escapeHtml((displayName[0] || 'П').toUpperCase())}</div>`;
            
            const tagsMarkup = activeProfileTags.map(t => {
                const encoded = encodeURIComponent(String(t));
                return `<div class="profile-tag-row"><button type="button" class="profile-tag-chip" onclick="openProfileTagSearch(decodeURIComponent('${encoded}'))">${escapeHtml(normalizeSearchTag(t))}</button>${isOwner ? `<button type="button" class="profile-tag-edit" title="Изменить тег" aria-label="Изменить тег" onclick="event.stopPropagation();editProfileTag(decodeURIComponent('${encoded}'))"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg></button><button type="button" class="profile-tag-delete" title="Удалить тег" aria-label="Удалить тег" onclick="event.stopPropagation();deleteProfileTag(decodeURIComponent('${encoded}'))">×</button>` : ''}</div>`;
            }).join('');
            const ownTagButton = isOwner ? `<button class="profile-action secondary" onclick="addProfileTags()">Привязанные теги</button>` : '';

            // Формируем список публикаций — сравнение по нормализованному ключу
            let userPostsHtml = '<div class="profile-empty">Нет публикаций</div>';
            let postsCount = 0;
            let totalPostLikes = 0; // <-- НОВАЯ ПЕРЕМЕННАЯ

            if (activeProfileTags.length > 0) {
                const tagKeys = activeProfileTags.map(t => normalizeTagKey(t));
                let postsForTags = allPostsData.filter(p => tagKeys.includes(normalizeTagKey(p.tag)));
                postsCount = postsForTags.length;
                
                if (postsForTags.length > 0) {
                    // Считаем общее количество лайков на этих публикациях

        let profileSearchRequest = 0;
        async function searchProfiles(rawQuery, targetId = 'profileSearchResults') {
            const results = document.getElementById(targetId);
            const query = String(rawQuery || '').trim().replace(/^@/, '');
            if (!results) return;
            if (query.length < 2) {
                results.classList.remove('open');
                results.innerHTML = '';
                return;
            }
            const requestId = ++profileSearchRequest;
            results.innerHTML = '<div class="profile-empty" style="padding:12px;">Поиск…</div>';
            results.classList.add('open');
            const escaped = query.replace(/[,%_]/g, ch => '\\' + ch);
            const [usersResult, profilesResult] = await Promise.all([
                supabaseClient.from('users').select('id, username').ilike('username', `%${escaped}%`).limit(20),
                supabaseClient.from('user_profiles').select('user_id, display_name, avatar_url').ilike('display_name', `%${escaped}%`).limit(20)
            ]);
            if (requestId !== profileSearchRequest) return;
            const users = usersResult.data || [];
            const profiles = profilesResult.data || [];
            const byId = new Map(users.map(u => [String(u.id), { ...u }]));
            profiles.forEach(p => {
                const existing = byId.get(String(p.user_id)) || { id:p.user_id, username:'' };
                byId.set(String(p.user_id), { ...existing, ...p });
            });
            const matches = [...byId.values()].filter(u =>
                String(u.username || '').toLowerCase().includes(query.toLowerCase()) ||
                String(u.display_name || '').toLowerCase().includes(query.toLowerCase())
            ).slice(0, 12);
            if (!matches.length) {
                results.innerHTML = '<div class="profile-empty" style="padding:12px;">Профили не найдены</div>';
                return;
            }
            results.innerHTML = matches.map(u => {
                const name = u.display_name || String(u.username || '').replace(/^@/, '') || 'Пользователь';
                const handle = u.username ? '@' + String(u.username).replace(/^@/, '') : '';
                const avatar = u.avatar_url ? `<img class="profile-search-avatar" src="${escapeHtml(u.avatar_url)}" alt="">` : `<div class="profile-search-avatar" style="display:flex;align-items:center;justify-content:center;">${escapeHtml(name.charAt(0).toUpperCase())}</div>`;
                return `<button type="button" class="profile-search-result" onclick="selectSearchedProfile('${String(u.id).replace(/'/g, '')}')">${avatar}<span><strong>${escapeHtml(name)}</strong><small>${escapeHtml(handle)}</small></span></button>`;
            }).join('');
        }

            if (error) { alert('Не удалось загрузить привязанные теги.'); return; }

            const { data: existing } = await supabaseClient.from('likes').select('tag').eq('user_id', currentUser.id).in('tag', values);

            if (alreadyFollowing) {

                if (delError) { alert('Не удалось отменить подписку.'); return; }
            } else {

                const { error: addError } = await supabaseClient.from('likes').insert(missing.map(tag => ({ user_id: currentUser.id, tag })));

        // === ВАЛИДАЦИЯ И УНИКАЛЬНОСТЬ ТЕГОВ ===
        async function addProfileTags() {
            if (!currentUser || String(activeProfileUserId) !== String(currentUser.id)) return;
            const input = prompt('Введите один или несколько тегов через запятую:');
            if (input === null) return;

            // Нормализуем вводимые теги
            const rawTags = input.split(',').map(t => t.trim()).filter(Boolean);
            if (!rawTags.length) return;

            const tags = [...new Set(rawTags.map(t => {
                const clean = t.replace(/^#+/, '');
                return clean.startsWith('@') ? clean : '@' + clean;
            }))];

            // 1) Все теги должны существовать в photos (сравнение без @)
            const existingTagKeys = new Set(allPostsData.map(p => normalizeTagKey(p.tag)));
            const missing = tags.filter(t => !existingTagKeys.has(normalizeTagKey(t)));
            if (missing.length) {
                showToast('Тег не найден в приложении: ' + missing.map(normalizeSearchTag).join(', '));
                return;
            }

            // 2) Проверка уникальности — тег не должен быть привязан к другому профилю
            const keys = tags.map(normalizeTagKey);
            const { data: allProfileTags, error: checkError } = await supabaseClient
                .from('profile_tags').select('user_id, tag');
            if (checkError) { alert('Не удалось проверить теги: ' + checkError.message); return; }

            const conflicts = [];
            (allProfileTags || []).forEach(row => {
                if (!row.tag) return;
                if (String(row.user_id) === String(currentUser.id)) return;
                if (keys.includes(normalizeTagKey(row.tag))) {
                    conflicts.push(normalizeSearchTag(row.tag));
                }
            });
            if (conflicts.length) {
                showToast('Тег уже привязан к другому профилю: ' + [...new Set(conflicts)].join(', '));
                return;
            }

            const { error } = await supabaseClient.from('profile_tags').upsert(
                tags.map(tag => ({ user_id: currentUser.id, tag })),
                { onConflict: 'user_id,tag', ignoreDuplicates: true }
            );
            if (error) { alert('Не удалось сохранить теги: ' + error.message); return; }
            showToast('Теги сохранены');
            await openUserProfile(currentUser.id);
        }

        async function editProfileTag(oldTag) {
            if (!currentUser || String(activeProfileUserId) !== String(currentUser.id)) return;
            const input = prompt('Изменить тег:', normalizeSearchTag(oldTag));
            if (input === null) return;
            const newTag = normalizeSearchTag(input);
            if (!newTag) { alert('Укажите тег.'); return; }
            if (newTag === oldTag) return;

            // Проверка существования
            const existingTagKeys = new Set(allPostsData.map(p => normalizeTagKey(p.tag)));
            if (!existingTagKeys.has(normalizeTagKey(newTag))) {
                showToast('Тег не найден в приложении: ' + newTag);
                return;
            }
            // Проверка уникальности
            const { data: allProfileTags } = await supabaseClient.from('profile_tags').select('user_id, tag');
            const conflict = (allProfileTags || []).find(row =>
                row.tag && String(row.user_id) !== String(currentUser.id) &&
                normalizeTagKey(row.tag) === normalizeTagKey(newTag)
            );
            if (conflict) {
                showToast('Тег уже привязан к другому профилю: ' + normalizeSearchTag(conflict.tag));
                return;
            }

            const { error } = await supabaseClient.from('profile_tags').update({ tag: newTag })
                .eq('user_id', currentUser.id).eq('tag', oldTag);
            if (error) { alert('Не удалось изменить тег: ' + error.message); return; }
            if (tagProfileOwners[normalizeTagKey(oldTag)] === currentUser.id) delete tagProfileOwners[normalizeTagKey(oldTag)];
            tagProfileOwners[normalizeTagKey(newTag)] = currentUser.id;
            await openUserProfile(currentUser.id);
        }

        // Вставка Markdown-разметки в textarea (профиль или описание поста)
        function insertMarkdown(target, type) {
            const ta = target === 'desc' ? document.getElementById('descInput') : document.getElementById('profileEditBio');
            if (!ta) return;
            ta.focus();
            const start = ta.selectionStart;
            const end = ta.selectionEnd;
            const selected = ta.value.slice(start, end);
            let before = '', after = '', placeholder = '';

            if (type === 'bold') {
                before = '**'; after = '**'; placeholder = 'жирный текст';
            } else if (type === 'italic') {
                before = '_'; after = '_'; placeholder = 'курсив';
            } else if (type === 'link') {
                before = '['; after = '](url)'; placeholder = 'текст';
            } else {
                return;
            }

            const insertText = before + (selected || placeholder) + after;
            ta.value = ta.value.slice(0, start) + insertText + ta.value.slice(end);

            // Выделяем вставленный текст (или placeholder), чтобы удобно заменить
            const selStart = start + before.length;
            const selEnd = selStart + (selected || placeholder).length;
            ta.setSelectionRange(selStart, selEnd);
        }

        async function uploadProfileAvatar(input) {
            const file = input.files?.[0];
            if (!file || !currentUser || String(activeProfileUserId) !== String(currentUser.id)) return;
            try {
                const bitmap = await createImageBitmap(file);
                const canvas = document.createElement('canvas');
                canvas.width = 500; canvas.height = 500;
                const ctx = canvas.getContext('2d');
                const side = Math.min(bitmap.width, bitmap.height);
                const sx = (bitmap.width - side) / 2, sy = (bitmap.height - side) / 2;
                ctx.drawImage(bitmap, sx, sy, side, side, 0, 0, 500, 500);
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.88));
                if (!blob) throw new Error('Не удалось обработать изображение');
                const path = `${currentUser.id}/${Date.now()}.jpg`;
                const { error: uploadError } = await supabaseClient.storage.from('avatars').upload(path, blob, { contentType: 'image/jpeg', upsert: true });
                if (uploadError) throw uploadError;
                const { data: publicData } = supabaseClient.storage.from('avatars').getPublicUrl(path);
                const { error } = await supabaseClient.from('user_profiles').upsert(
                    { user_id: currentUser.id, avatar_url: publicData.publicUrl },
                    { onConflict: 'user_id' }
                );
                if (error) throw error;
                currentUser = { ...currentUser, avatar_url: publicData.publicUrl };
                localStorage.setItem('cult_user', JSON.stringify(currentUser));
                await openUserProfile(currentUser.id);
            } catch (err) {
                console.error(err);
                alert('Не удалось загрузить аватар. Проверьте настройки хранилища avatars в Supabase.');
            }
        }

        // Берётся 5 случайных тегов и по одному случайному фото каждого. Слайды плавно скользят на одной пружине,

        // Когда показаны все 5 фото, к ленте слайдов подклеивается следующая пятёрка тегов и она продолжает скользить дальше.
        let tagShowcaseInstance = null;

        async function showcaseLikeClick(e, photoId) {

        function initTagShowcase() {
            if (tagShowcaseInstance) { tagShowcaseInstance.destroy(); tagShowcaseInstance = null; }
            const root = document.getElementById('tagShowcase');
            if (!root) return;
            root.innerHTML = '';

            // Теги и их фото — из загруженных из базы одобренных постов
            const byTag = new Map();
            allPostsData.forEach(p => {
                if (!p.tag || !p.img) return;
                const key = normalizeTagKey(p.tag);
                if (!byTag.has(key)) byTag.set(key, { tag: p.tag, photos: [] });
                byTag.get(key).photos.push(p);
            });
            const tags = [...byTag.values()];
            if (!tags.length) return;
            const totalPhotos = tags.reduce((sum, t) => sum + t.photos.length, 0);

            const BATCH = 5, HOLD = 3.2;
            const n = Math.min(BATCH, tags.length);
            const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

            // Минимум повторов: теги идут по кругу — сначала те, что не показывались дольше всех;
            // фото каждого тега тоже идут по кругу (новое фото, пока не показаны все остальные).
            let tick = 0, lastTagShown = null;
            tags.forEach(t => { t.last = -1; t.queue = []; t.lastPhoto = null; });
            const pickPhoto = t => {
                if (!t.queue.length) {
                    t.queue = shuffle(t.photos.slice());
                    const q = t.queue;
                    if (q.length > 1 && q[q.length - 1] === t.lastPhoto) [q[0], q[q.length - 1]] = [q[q.length - 1], q[0]];
                }
                t.lastPhoto = t.queue.pop();
                return t.lastPhoto;
            };
            const nextBatch = () => {
                const order = shuffle(tags.slice()).sort((a, b) => a.last - b.last);   // sort стабилен: равные остаются в случайном порядке
                const picked = shuffle(order.slice(0, n));
                if (picked.length > 1 && picked[0].tag === lastTagShown) picked.push(picked.shift());  // не ставим тот же тег подряд на стыке пятёрок
                lastTagShown = picked[picked.length - 1].tag;
                return picked.map(t => { t.last = tick++; return { tag: t.tag, photo: pickPhoto(t) }; });
            };
            const prepare = () => {
                const items = nextBatch();
                items.forEach(it => { it.pre = new Image(); it.pre.src = it.photo.img; });
                return items;
            };
            const makeSlide = it => {
                const s = document.createElement('div'); s.className = 'ts-slide';
                const bg = document.createElement('div'); bg.className = 'ts-bg';
                bg.style.backgroundImage = 'url("' + String(it.photo.img).replace(/["\\\r\n]/g, c => encodeURIComponent(c)) + '")';
                const im = document.createElement('img'); im.src = it.photo.img; im.alt = it.tag; im.draggable = false;
                const foot = document.createElement('div'); foot.className = 'ts-foot';
                const cap = document.createElement('div'); cap.className = 'ts-cap'; cap.textContent = '@' + String(it.tag).replace(/^[@#]+/, '');
                const like = document.createElement('button'); like.type = 'button';
                like.className = 'ts-like' + (likedPhotos.includes(Number(it.photo.id)) ? ' liked' : '');
                like.dataset.id = it.photo.id;
                like.setAttribute('aria-label', 'В избранное');
                like.innerHTML = '<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>';
                like.addEventListener('click', e => showcaseLikeClick(e, it.photo.id));
                foot.append(cap, like);
                s.append(bg, im, foot);
                return s;
            };

            root.innerHTML = '<div class="ts-view at-start"><div class="ts-strip"></div>' +
                '<button type="button" class="ts-nav ts-prev" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>' +
                '<button type="button" class="ts-nav ts-next" aria-label="Вперёд"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button></div>' +
                '<div class="ts-dots" role="tablist" aria-label="Случайные теги"><span class="ts-act"></span></div>';
            const view = root.querySelector('.ts-view'), strip = root.querySelector('.ts-strip');
            const dotsEl = root.querySelector('.ts-dots'), act = root.querySelector('.ts-act');
            const canMove = totalPhotos > 1;
            if (!canMove) view.querySelectorAll('.ts-nav').forEach(b => b.remove());

            // Пружины (жёсткость, демпфирование)
            const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const S = (x, k = 400, c = 30) => ({ x, v: 0, t: x, k, c });
            const tune = (s, k, c) => { s.k = k; s.c = reduce ? 2 * Math.sqrt(k) : c; };
            const step = (s, dt) => { const a = -s.k * (s.x - s.t) - s.c * s.v; s.v += a * dt; s.x += s.v * dt; };
            const P = S(0, 170, 22), A = S(0), B = S(0);

            // Лента слайдов: base — номер первого слайда в DOM, g — номер текущего. Пятёрки подклеиваются по мере надобности,
            // а одна предыдущая пятёрка остаётся в DOM, чтобы можно было листать назад.
            let base = 0, g = 0, pending = null, waitTries = 0;
            let clock = 0, nextAt = HOLD, visible = false, ready = false, dead = false, drag = null;
            const loaded = () => base + strip.children.length;
            const dotOf = k => ((k % n) + n) % n;
            const batchStart = () => Math.floor(g / n) * n;
            const appendBatch = () => {
                const items = pending || prepare();
                items.forEach(it => strip.appendChild(makeSlide(it)));
                pending = prepare();
            };
            appendBatch();

            const btns = Array.from({ length: n }, (_, i) => {
                const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', 'Слайд ' + (i + 1));
                b.addEventListener('click', () => { nextAt = clock + 7; move(batchStart() + i); });
                dotsEl.appendChild(b);
                return b;
            });
            if (n < 2) dotsEl.style.display = 'none';

            // пилюля 20px над точками через 22px (8 + 14): по 8px воздуха до соседей
            const setDot = (i, snap, dir) => {
                btns.forEach((b, k) => b.setAttribute('aria-selected', String(k === i)));
                const b = btns[i], w = 20, c = b.offsetLeft + b.offsetWidth / 2;
                A.t = c - w / 2; B.t = c + w / 2;
                if (dir > 0) { tune(B, 520, 34); tune(A, 140, 18); } else { tune(A, 520, 34); tune(B, 140, 18); }
                if (snap) { A.x = A.t; B.x = B.t; }
            };
            // Переход к слайду с номером to (вперёд, назад, по точке)
            const move = to => {
                if (!canMove || to < base) return false;
                while (to >= loaded()) appendBatch();
                const oldDot = dotOf(g);
                g = to; P.t = g - base;
                nextAt = Math.max(nextAt, clock + HOLD);
                view.classList.toggle('at-start', g <= base);
                if (ready) setDot(dotOf(g), false, dotOf(g) >= oldDot ? 1 : -1);
                return true;
            };
            const advance = () => {
                if (g + 1 >= loaded() && pending && !pending.every(it => it.pre.complete) && waitTries++ < 6) { nextAt = clock + 1; return; }
                waitTries = 0;
                nextAt = clock + HOLD;
                move(g + 1);
            };
            view.querySelector('.ts-prev')?.addEventListener('click', e => { e.stopPropagation(); nextAt = clock + 7; move(g - 1); });
            view.querySelector('.ts-next')?.addEventListener('click', e => { e.stopPropagation(); nextAt = clock + 7; move(g + 1); });

            // Свайп пальцем или мышью (вертикальная прокрутка ленты не затрагивается: touch-action: pan-y)
            const SWIPE_ENABLED = false;   // свайп пальцем/мышью отключён
            view.addEventListener('pointerdown', e => {
                if (!SWIPE_ENABLED || !canMove || (e.pointerType === 'mouse' && e.button !== 0)) return;
                if (e.target.closest('.ts-like, .ts-nav')) return;
                drag = { id: e.pointerId, x: e.clientX, y: e.clientY, active: false, from: 0, lastX: e.clientX, lastT: performance.now(), vx: 0 };
            });
            view.addEventListener('pointermove', e => {
                if (!drag || e.pointerId !== drag.id) return;
                const dx = e.clientX - drag.x;
                if (!drag.active) {
                    if (Math.abs(dx) < 8 || Math.abs(dx) < Math.abs(e.clientY - drag.y)) return;
                    drag.active = true;
                    try { view.setPointerCapture(e.pointerId); } catch (_) {}
                    if (g + 1 >= loaded()) appendBatch();          // справа уже должна ждать следующая фотография
                    drag.from = P.x; drag.x = e.clientX; P.v = 0;
                    nextAt = clock + 7;
                }
                const now = performance.now();
                drag.vx = (e.clientX - drag.lastX) / Math.max(1, now - drag.lastT); drag.lastX = e.clientX; drag.lastT = now;
                const w = view.clientWidth || 1, hi = loaded() - base - 1;
                let x = drag.from - (e.clientX - drag.x) / w;
                if (x < 0) x *= 0.3; else if (x > hi) x = hi + (x - hi) * 0.3;   // у краёв лента «резинит»
                P.x = P.t = x; P.v = 0;
            });
            const endDrag = e => {
                if (!drag || e.pointerId !== drag.id) return;
                const d = drag; drag = null;
                if (!d.active) return;
                try { view.releasePointerCapture(e.pointerId); } catch (_) {}
                const w = view.clientWidth || 1, dx = e.clientX - d.x;
                const dir = Math.abs(d.vx) > 0.4 ? (d.vx < 0 ? 1 : -1) : (dx < -w * 0.15 ? 1 : dx > w * 0.15 ? -1 : 0);
                if (!dir || !move(g + dir)) P.t = g - base;
            };
            view.addEventListener('pointerup', endDrag);
            view.addEventListener('pointercancel', endDrag);

            const dragging = () => drag && drag.active;
            const frame = dt => {
                clock += dt;
                if (!ready && btns[0].offsetWidth) { setDot(dotOf(g), true, 1); ready = true; }
                if (!visible || dragging()) nextAt = clock + HOLD;      // пока блок не на экране или его держат — не листаем
                else if (ready && canMove && clock >= nextAt) advance();
                for (let k = 0; k < 4; k++) { if (!dragging()) step(P, dt / 4); step(A, dt / 4); step(B, dt / 4); }
                // старые слайды убираем (остаётся одна предыдущая пятёрка), положение при этом не прыгает
                if (!dragging()) while (batchStart() - base > n) { strip.removeChild(strip.firstChild); base++; P.x -= 1; P.t -= 1; }
            };
            const render = () => {
                strip.style.transform = 'translateX(' + (-P.x * 100).toFixed(3) + '%)';
                act.style.transform = 'translateX(' + A.x.toFixed(2) + 'px)';
                act.style.width = Math.max(8, B.x - A.x).toFixed(2) + 'px';
            };

            let last = performance.now(), raf = 0;
            const loop = now => {
                if (dead) return;
                if (!root.isConnected) { inst.destroy(); return; }
                const dt = Math.min((now - last) / 1000, 1 / 30); last = now;
                frame(dt); render();
                raf = requestAnimationFrame(loop);
            };
            raf = requestAnimationFrame(loop);

            const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => { visible = es[es.length - 1].isIntersecting; }, { threshold: 0.3 }) : null;
            if (io) io.observe(root); else visible = true;
            const ro = 'ResizeObserver' in window ? new ResizeObserver(() => { if (ready) setDot(dotOf(g), true, 1); }) : null;
            if (ro) ro.observe(dotsEl);

            const inst = { destroy() { dead = true; cancelAnimationFrame(raf); if (io) io.disconnect(); if (ro) ro.disconnect(); } };
            tagShowcaseInstance = inst;
        }

        function toggleLens(e, postId, imgUrl) {
            if (e) { e.stopPropagation(); e.preventDefault(); }
            if (navigator.vibrate) navigator.vibrate(20);
            const container = document.getElementById(`lens-container-${postId}`);
            const lens = document.getElementById(`lens-${postId}`);
            const img = document.getElementById(`lens-img-${postId}`);

            if (activeLens && activeLens !== container) activeLens.classList.remove('active');
            if (container.classList.contains('active')) {
                container.classList.remove('active');
                activeLens = null;
                return;
            }
            activeLens = container;
            container.classList.add('active');

            const sourceImage = container.parentElement.querySelector('.dynamic-img');
            const containerRect = container.getBoundingClientRect();
            const sourceRect = sourceImage.getBoundingClientRect();
            const startX = sourceRect.left - containerRect.left + sourceRect.width / 2;
            const startY = sourceRect.top - containerRect.top + sourceRect.height / 2;
            img.style.width = `${containerRect.width}px`;
            img.style.height = `${containerRect.height}px`;
            moveLens(lens, img, startX, startY, containerRect.width, containerRect.height);

            let isDragging = false;
            let grabOffsetX = 0;
            let grabOffsetY = 0;
            const stopGesture = ev => {
                ev.preventDefault();
                ev.stopPropagation();
                if (typeof ev.stopImmediatePropagation === 'function') ev.stopImmediatePropagation();
            };

            lens.onpointerdown = (ev) => {
                stopGesture(ev);
                isDragging = true;
                const rect = container.getBoundingClientRect();
                const lensRect = lens.getBoundingClientRect();
                grabOffsetX = ev.clientX - lensRect.left - lensRect.width / 2;
                grabOffsetY = ev.clientY - lensRect.top - lensRect.height / 2;
                try { lens.setPointerCapture(ev.pointerId); } catch (_) {}
                try { tg.disableVerticalSwipes(); } catch (_) {}
            };
            lens.onpointermove = (ev) => {
                if (!isDragging) return;
                stopGesture(ev);
                const rect = container.getBoundingClientRect();
                moveLens(lens, img, ev.clientX - rect.left - grabOffsetX, ev.clientY - rect.top - grabOffsetY, rect.width, rect.height);
            };
            const finishLensDrag = (ev) => {
                if (ev) stopGesture(ev);
                isDragging = false;
                if (ev && lens.hasPointerCapture && lens.hasPointerCapture(ev.pointerId)) {
                    try { lens.releasePointerCapture(ev.pointerId); } catch (_) {}
                }
                try { tg.disableVerticalSwipes(); } catch (_) {}
            };
            lens.onpointerup = finishLensDrag;
            lens.onpointercancel = finishLensDrag;
            lens.ondragstart = ev => stopGesture(ev);
            lens.addEventListener('touchstart', stopGesture, { passive: false });
            lens.addEventListener('touchmove', stopGesture, { passive: false });
            lens.addEventListener('touchend', stopGesture, { passive: false });
        }

        function moveLens(lens, img, x, y, w, h) {
            const lensSize = 160;
            const zoom = 2.5;
            const radius = lensSize / 2;
            x = Math.max(radius, Math.min(w - radius, x));
            y = Math.max(radius, Math.min(h - radius, y));
            lens.style.left = `${x - radius}px`;
            lens.style.top = `${y - radius}px`;
            img.style.width = `${w}px`;
            img.style.height = `${h}px`;
            img.style.transform = `translate(${radius - x * zoom}px, ${radius - y * zoom}px) scale(${zoom})`;
            img.style.transformOrigin = '0 0';
        }

            const tapLength = currentTime - lastTap;

                handleDoubleTap(e, postId);

        async function onUsernameInput() {

        function updatePasswordStrength() {
            const pw = document.getElementById('authPassword').value;
            const bars = [document.getElementById('pwBar1'), document.getElementById('pwBar2'), document.getElementById('pwBar3'), document.getElementById('pwBar4')];
            const text = document.getElementById('pwStrengthText');
            
            let score = 0;
            if (pw.length >= 6) score = 1;
            if (pw.length >= 8 && /[a-z]/.test(pw) && /[A-Z]/.test(pw)) score = 2;
            if (/\d/.test(pw)) score = 3;
            if (/[^A-Za-z0-9]/.test(pw) && pw.length >= 10) score = 4;

            const colors = ['var(--red)', 'var(--orange)', 'var(--yellow)', 'var(--green)'];
            const labels = ['Слишком короткий', 'Слабый', 'Средний', 'Хороший', 'Надежный'];

            bars.forEach((bar, i) => {
                if (i < score) {
                    bar.style.width = '100%';
                    bar.style.backgroundColor = colors[Math.min(score - 1, 3)];
                } else {
                    bar.style.width = '0%';
                }
            });

            text.textContent = labels[score];
            text.style.color = score > 0 ? colors[Math.min(score - 1, 3)] : 'var(--secondary-text)';
        }

        async function submitAuth() {
            const usernameInput = document.getElementById('authUsername');
            const passwordInput = document.getElementById('authPassword');
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            
            if (!username || !password) { alert("Заполните оба поля!"); return; }
            if (/[а-яА-ЯёЁ]/.test(username)) { alert("Логин должен содержать только латиницу!"); return; }
            if (/[а-яА-ЯёЁ]/.test(password)) { alert("Пароль должен содержать только латиницу!"); return; }

            const btn = document.querySelector('.auth-btn');
            btn.innerText = 'Проверка...'; btn.disabled = true;
            try {
                const { data: existingUser } = await supabaseClient.from('users').select('*').eq('username', username).single();
                if (existingUser) {
                    if (existingUser.password === password) {
                        currentUser = existingUser;
                        localStorage.setItem('cult_user', JSON.stringify(existingUser));
                        closeModal({ target: authModal }, 'authModal');
                        if (isDesktop()) { showDefaultDock(); syncGuestMode(); }
                        loadRealPhotos(true);
                    } else { alert("Неверный пароль!"); }
                } else {
                    const { data: newUser, error: insertError } = await supabaseClient.from('users').insert([{ username, password }]).select().single();
                    if (newUser) {
                        currentUser = newUser;
                        localStorage.setItem('cult_user', JSON.stringify(newUser));
                        closeModal({ target: authModal }, 'authModal');
                        if (isDesktop()) { showDefaultDock(); syncGuestMode(); }
                        loadRealPhotos(true);
                    } else { alert("Ошибка: " + insertError.message); }
                }
            } catch (err) { alert("Ошибка сети"); } finally {
                btn.innerText = 'Продолжить'; btn.disabled = false;
                usernameInput.value = ''; passwordInput.value = '';
            }
        }

        async function toggleLike(e, postId) {
            if (e) e.stopPropagation();
            const idAsNumber = parseInt(postId);
            const btn = document.querySelector(`#post-${postId} .like-btn`);
            if (btn) btn.disabled = true;
            if (likedPhotos.includes(idAsNumber)) {
                const { error } = await supabaseClient.from('likes').delete().eq('photo_id', idAsNumber).eq('user_id', currentUser.id);
                if (!error) {
                    likedPhotos = likedPhotos.filter(id => id !== idAsNumber);

                    allLikesCache = allLikesCache.filter(l => !(l.photo_id === idAsNumber && l.user_id == currentUser.id));
                    updatePostLikeCount(idAsNumber);
                }
            } else {
                const { error } = await supabaseClient.from('likes').insert([{ photo_id: idAsNumber, user_id: currentUser.id }]);
                if (!error) {
                    likedPhotos.push(idAsNumber);
                    if (btn) btn.classList.add('liked');
                    allLikesCache.push({ photo_id: idAsNumber, user_id: currentUser.id });
                    updatePostLikeCount(idAsNumber);

        async function loadComments(photoId) {
            const list = document.getElementById('commentsList');
            list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--secondary-text);">Загрузка...</div>';
            
            const { data, error } = await supabaseClient.from('comments')
                .select(`*, users(username)`)
                .eq('photo_id', photoId)
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Ошибка загрузки комментариев:', error);
                list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--secondary-text);">Не удалось загрузить комментарии</div>';
                return;
            }

            const commentUserIds = [...new Set((data || []).map(c => c.user_id).filter(Boolean))];
            let commentAvatars = {};
            if (commentUserIds.length) {
                const { data: profileRows, error: avatarError } = await supabaseClient
                    .from('user_profiles').select('user_id, avatar_url').in('user_id', commentUserIds);
                if (!avatarError) {
                    commentAvatars = Object.fromEntries((profileRows || []).map(row => [String(row.user_id), row.avatar_url]));
                }
            }
            list.innerHTML = '';
            
            if (!data || data.length === 0) {
                list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--secondary-text);">Нет комментариев</div>';
                return;
            }

            const rootComments = data.filter(c => !c.parent_id);
            
            const renderComment = (c, includeReplies = true) => {
                const dateStr = new Date(c.created_at).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }) + ' ' + 
                                new Date(c.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                
                const isMyComment = currentUser && currentUser.id == c.user_id;
                const replies = includeReplies ? data.filter(r => r.parent_id === c.id) : [];

                let actionButtons = '';
                if (isMyComment) {
                    actionButtons = `
                        <div class="comment-actions">
                            <button class="comment-act-btn" onclick="editComment('${c.id}', '${c.text.replace(/'/g, "\\'")}')">Изменить</button>
                            <button class="comment-act-btn" onclick="deleteComment('${c.id}')">Удалить</button>
                        </div>
                    `;
                }

                let repliesHTML = '';
                if (replies.length > 0) {
                    repliesHTML = `<div class="comment-replies">${replies.map(r => renderComment(r, false)).join('')}</div>`;
                }

                const authorName = c.users?.username || 'unknown';
                const authorAvatar = commentAvatars[String(c.user_id)];
                const avatarMarkup = authorAvatar
                    ? `<img class="comment-author-avatar" src="${escapeHtml(authorAvatar)}" alt="Аватар ${escapeHtml(authorName)}" loading="lazy">`
                    : `<span class="comment-author-avatar-placeholder" aria-hidden="true">${escapeHtml((authorName[0] || '?').toUpperCase())}</span>`;

                return `
                    <div class="comment-item" id="comment-${c.id}">
                        ${actionButtons}
                        <div class="comment-header">
                            <span class="comment-author-wrap" style="cursor:pointer;" onclick="openUserProfile('${c.user_id}')">${avatarMarkup}<span class="comment-author">@${escapeHtml(authorName)}</span></span>
                            <span class="comment-text" id="comment-text-${c.id}">${c.text}</span>
                        </div>
                        <span class="comment-date">${dateStr}</span>
                        ${repliesHTML}
                    </div>
                `;
            };

            rootComments.forEach(c => { list.innerHTML += renderComment(c); });
        }

        function handleFileSelect(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.getElementById('compressCanvas');
                        const ctx = canvas.getContext('2d');
                        let width = img.width, height = img.height;
                        const MAX_SIZE = 1080;
                        if (width > height && width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                        else if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                        canvas.width = width; canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob(function(blob) {
                            currentFileToUpload = new File([blob], "photo.jpg", { type: "image/jpeg" });
                            previewImage.src = URL.createObjectURL(blob);
                            previewImage.style.display = 'block';
                            document.getElementById('uploadText').innerText = 'Файл выбран';
                            document.getElementById('uploadIcon').style.display = 'none';
                            document.getElementById('replaceFileBtn').style.display = 'block';
                        }, 'image/jpeg', 0.8);
                    }
                    img.src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }
