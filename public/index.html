        function openModal(id, opts) {
            try { tg.disableVerticalSwipes(); } catch (_) {}
            const modal = document.getElementById(id);
            clearTimeout(modal._closeTimer);
            if (isDesktop()) {
                // Если панели свёрнуты, а пользователь открывает окно — разворачиваем обратно
                if (panelsCollapsed && !(opts && (opts.keepCollapsed || opts.silent || opts.noFocus)) && (id !== 'profileModal' || viewingOtherProfile)) setPanelsCollapsed(false);
                // Окно входа: если поверх него открыт чужой профиль — возвращаем вход
                if (id === 'authModal' && viewingOtherProfile) showDefaultDock();
                // Окна меню делят одно место справа от кнопок: открывается одно, остальные закрываются
                if (DESKTOP_RIGHT_WINDOWS.includes(id)) {
                    DESKTOP_RIGHT_WINDOWS.forEach(otherId => {
                        const other = document.getElementById(otherId);
                        if (otherId !== id && other && other.classList.contains('active')) closeModal({ target: other }, otherId, true);
                    });
                }
                if (id === 'authModal' && modal.classList.contains('active') && !(opts && opts.noFocus)) {
                    const u = document.getElementById('authUsername');
                    if (u) u.focus();
                }
            } else {
                clearTimeout(controlsRevealTimer);
                clearTimeout(scrollTimeout);
                clearTimeout(hideArrowTimeout);
                bottomControls.classList.add('hidden');
                btnPulseDown.classList.add('hidden');
                btnPulseUp.classList.add('hidden');
                document.body.classList.add('modal-open');
            }
            const content = modal.querySelector('.modal-content');
            if (content) content.style.transform = '';
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);
        }

        function closeModal(e, id, replacing) {
            if (e.target === document.getElementById(id) || !e.target) {
                const modal = document.getElementById(id);
                const content = modal.querySelector('.modal-content');
                const desk = isDesktop();
                // На ПК окно загрузки медиа закрыть нельзя — его может только заменить другое окно справа
                if (desk && id === 'submitModal' && !replacing) return;
                // На ПК без авторизации окно поиска по тегам тоже нельзя закрыть
                if (desk && id === 'searchModal' && !currentUser && !replacing) return;
                const docked = desk && (id === 'profileModal' || id === 'authModal');
                if (docked) {
                    // Слева на ПК всегда открыт вход (без авторизации) или свой профиль
                    if (id === 'authModal' && !currentUser) return;
                    if (id === 'profileModal' && currentUser && !viewingOtherProfile) return;
                }
                if (id === 'profileModal') {
                    // Возвращаем стандартный z-index, чтобы следующее открытие было корректным
                    modal.style.zIndex = '';
                    
                    const inputs = document.querySelectorAll('.profile-search-input');
                    const results = document.querySelectorAll('.profile-search-results');
                    inputs.forEach(i => i.value = '');
                    results.forEach(r => { r.classList.remove('open'); r.innerHTML = ''; });
                }
                modal.classList.remove('active');
                if (!desk) document.body.classList.remove('modal-open');
                if (!docked) {
                    if (id === 'profileModal' || id === 'authModal') {
                        // Профиль/вход лежат поверх поиска или избранного — их кнопки и состояние не сбрасываем
                        restoreFloatingButtons();
                    } else {
                        setFloating(null);
                        isFavoriteTagsView = false;
                    }
                }
                
                if (id === 'commentsModal') {
                    cancelReply();
                    editingCommentId = null;
                    document.querySelector('.add-comment-btn').textContent = 'Отправить';
                    document.getElementById('floatingPostDesc').style.display = 'none';
                }

                clearTimeout(modal._closeTimer);
                modal._closeTimer = setTimeout(() => {
                    modal.style.display = 'none';
                    if (content) content.style.transform = '';
                    updateControlsVisibility(feed.scrollTop);
                }, 400);
                // После закрытия другого окна справа возвращаем окно загрузки медиа
                if (desk && !replacing && id !== 'submitModal' && DESKTOP_RIGHT_WINDOWS.includes(id)) openDefaultRightWindow();
                if (id === 'chainsawModal' && !replacing) {
                    if (!desk && chainsawReturnToSubmit) openModal('submitModal');
                    chainsawReturnToSubmit = false;
                }
            }
        }

        let touchStartY = 0;
        let currentTouchModal = null;
        document.addEventListener('touchstart', (e) => {
            if (e.target.closest('.modal-overlay')) {
                try { tg.disableVerticalSwipes(); } catch (_) {}
            }
            const dragArea = e.target.closest('.modal-drag-area');
            if (dragArea && !isDesktop()) {
                currentTouchModal = dragArea.closest('.modal-content');
                touchStartY = e.touches[0].clientY;
            }
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            if (!currentTouchModal) return;
            const deltaY = e.touches[0].clientY - touchStartY;
            if (deltaY > 0) {
                if (e.cancelable) e.preventDefault(); 
                currentTouchModal.style.transform = `translateY(${deltaY}px)`;
            }
        }, { passive: false }); 

        document.addEventListener('touchend', (e) => {
            if (!currentTouchModal) return;
            const deltaY = e.changedTouches[0].clientY - touchStartY;
            if (deltaY > 100) {
                const modal = currentTouchModal.closest('.modal-overlay');
                if (modal) closeModal({ target: modal }, modal.id);
            } else {
                currentTouchModal.style.transform = '';
            }
            currentTouchModal = null;
        });

                                    <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                                </button>
                                <button class="action-btn profile-btn" onclick="event.stopPropagation(); openTelegramLink('${tag}')">
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.6 4.2 18.4 19c-.24 1.05-.86 1.31-1.74.82l-4.8-3.54-2.32 2.23c-.26.26-.48.48-.98.48l.35-4.9 8.92-8.06c.39-.35-.08-.54-.6-.19L6.2 12.8l-4.66-1.46c-1.01-.32-1.03-1.01.21-1.5L20 3.1c.84-.31 1.58.2 1.6 1.1Z" fill="#000000" stroke="none"/></svg>
                                </button>

            if (filteredTags.length === 0 && isFavoriteTagsView) {

        function scrollToPost(id, modalId) {
            if (isDesktop()) {
                // На ПК окно остаётся открытым, лента просто прокручивается к нужному посту
                const target = document.getElementById(`post-${id}`);
                if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                return;
            }
            closeModal({ target: document.getElementById(modalId) }, modalId);
            setTimeout(() => {
                const post = document.getElementById(`post-${id}`);
                if (post) post.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 500);

        function openLikesModal() {
            const likesGrid = document.getElementById('likesGrid');
            likesGrid.innerHTML = '';
            let uniqueLikedIds = [...new Set(likedPhotos)];
            if (!isLikesSortedAsc) uniqueLikedIds = uniqueLikedIds.reverse();
            if (uniqueLikedIds.length === 0) {
                likesGrid.innerHTML = `<p style="grid-column: span 3; text-align: center; color: var(--secondary-text);">Пока пусто</p>`;

            isLikesSortedAsc = !isLikesSortedAsc;
            openLikesModal();

        function openTelegramLink(tag) {
            if (navigator.vibrate) navigator.vibrate(20);
            let username = tag.trim().replace(/@/g, '');
            const url = `https://t.me/${username}`;
            if (tg && tg.openLink) tg.openLink(url);
            else window.open(url, '_blank');

        function scrollToTop() {
            if (navigator.vibrate) navigator.vibrate(20);
            btnDown.classList.add('hidden');
            feed.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateControlsVisibility(scrollTop) {
            if (document.body.classList.contains('modal-open')) {
                bottomControls.classList.add('hidden');
                document.getElementById('profileFloatingBtn').classList.add('hidden');
                btnPulseDown.classList.add('hidden');
                btnPulseUp.classList.add('hidden');
                return;
            }

            if (activeLens) {
                activeLens.classList.remove('active');
                activeLens = null;
            }

            bottomControls.classList.add('scrolling');
            btnPulseDown.classList.add('scrolling');
            btnPulseUp.classList.add('scrolling');

            const scrollHeight = feed.scrollHeight;
            const clientHeight = feed.clientHeight;
            const isAtBottom = scrollTop + clientHeight >= scrollHeight - 50;
            const isAtTop = scrollTop <= 10;

            let showLogo = false;
            if (supportButtonOffset !== null && scrollTop >= supportButtonOffset - 20) showLogo = true;
            if (isAtBottom) showLogo = false;

            if (showLogo) logo.classList.remove('hide');
            else logo.classList.add('hide');

            if (isAtTop) {
                bottomControls.classList.add('hidden');
                btnPulseUp.classList.add('hidden');
                btnPulseDown.classList.remove('hidden');
            } else if (isAtBottom) {
                bottomControls.classList.add('hidden');
                document.getElementById('profileFloatingBtn').classList.add('hidden');
                btnPulseDown.classList.add('hidden');
                btnPulseUp.classList.remove('hidden');
            } else {
                btnPulseDown.classList.add('hidden');
                btnPulseUp.classList.add('hidden');
                bottomControls.classList.remove('hidden');
            }

            if (scrollTop > 200 && !isAtBottom) {
                btnDown.classList.remove('hidden');
                document.getElementById('profileFloatingBtn').classList.remove('hidden');
            } else {
                btnDown.classList.add('hidden');
                document.getElementById('profileFloatingBtn').classList.add('hidden');
            }

            logo.classList.add('shrunk');
            bottomControls.classList.add('shrunk');
            document.getElementById('profileFloatingBtn').classList.add('shrunk');
            btnPulseDown.classList.add('shrunk');
            btnPulseUp.classList.add('shrunk');
            btnDown.classList.add('shrunk');

            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                logo.classList.remove('shrunk');
                bottomControls.classList.remove('shrunk');
                document.getElementById('profileFloatingBtn').classList.remove('shrunk');
                btnPulseDown.classList.remove('shrunk');
                btnPulseUp.classList.remove('shrunk');
                btnDown.classList.remove('shrunk');
                bottomControls.classList.remove('scrolling');
                btnPulseDown.classList.remove('scrolling');
                btnPulseUp.classList.remove('scrolling');
            }, 200);

            clearTimeout(hideArrowTimeout);
            hideArrowTimeout = setTimeout(() => {
                if (scrollTop > 200 && !isAtBottom) {
                    btnDown.classList.add('hidden');
                    document.getElementById('profileFloatingBtn').classList.add('hidden');
                }
            }, 1000);
        }

        feed.addEventListener('scroll', () => {
            if (isProgrammaticScroll) return;
            updateControlsVisibility(feed.scrollTop);
        });

        function scrollToChat() {
            if (navigator.vibrate) navigator.vibrate(20);
            isProgrammaticScroll = true;
            btnPulseDown.classList.add('hidden');
            btnPulseUp.classList.add('hidden');

            const chatBtn = document.getElementById('topChatBtn');
            let target = chatBtn ? chatBtn.offsetTop : (supportButtonOffset || 200);
            const maxScroll = feed.scrollHeight - feed.clientHeight;
            if (target > maxScroll) target = maxScroll;

            feed.scrollTo({ top: target, behavior: 'smooth' });

            clearTimeout(programmaticScrollEndTimer);
            programmaticScrollEndTimer = setTimeout(() => {
                isProgrammaticScroll = false;
                updateControlsVisibility(feed.scrollTop);
            }, 700);
        }

        btnPulseDown.addEventListener('click', scrollToChat);
        btnPulseUp.addEventListener('click', scrollToChat);

        document.addEventListener('visibilitychange', () => {

        // ===================== ПК-режим: левая панель, закрытие окон, смена режима =====================
        // Слева всегда открыт профиль авторизованного пользователя (или окно входа без авторизации).
        function showDefaultDock() {
            if (!isDesktop()) return;
            const profileEl = document.getElementById('profileModal');
            const authEl = document.getElementById('authModal');
            viewingOtherProfile = false;
            profileEl.classList.remove('viewing-other');
            authEl.classList.remove('dock-covered');
            if (currentUser) {
                if (authEl.classList.contains('active')) closeModal({ target: authEl }, 'authModal');
                openUserProfile(currentUser.id);
            } else {
                profileLoadToken++;
                if (profileEl.classList.contains('active')) closeModal({ target: profileEl }, 'profileModal');
                openModal('authModal', { noFocus: true });
            }
        }

        // На ПК по умолчанию справа открыто окно загрузки медиа,
        // а без авторизации — поиск по тегам (его нельзя закрыть)
        function openDefaultRightWindow() {
            if (!isDesktop()) return;
            const anyOpen = DESKTOP_RIGHT_WINDOWS.some(id => document.getElementById(id).classList.contains('active'));
            if (anyOpen) return;
            if (currentUser) openModal('submitModal', { keepCollapsed: true });
            else openSearchModal({ keepCollapsed: true });
        }

        // Подгоняет правую панель под состояние авторизации (вход / выход)
        let desktopWasGuest = null;
        function syncGuestMode() {
            const guest = !currentUser;
            document.body.classList.toggle('guest', isDesktop() && guest);
            if (!isDesktop()) return;
            const isActive = id => document.getElementById(id).classList.contains('active');
            if (guest) {
                ['submitModal', 'likesModal'].forEach(id => {
                    if (isActive(id)) closeModal({ target: document.getElementById(id) }, id, true);
                });
                openDefaultRightWindow();
            } else if (desktopWasGuest === true && isActive('searchModal')) {
                closeModal({ target: document.getElementById('searchModal') }, 'searchModal', true);
                openModal('submitModal', { keepCollapsed: true });
            }
            desktopWasGuest = guest;
        }

        // Окно Chainsaw Squad: открывается справа и занимает всю оставшуюся ширину
        const CHAINSAW_URL = 'https://chainsawsquad.ru/';
        let chainsawReturnToSubmit = false;   // мобильная версия: после закрытия сайта возвращаем окно загрузки
        function toggleChainsaw() {
            const modal = document.getElementById('chainsawModal');
            if (modal.classList.contains('active')) { closeModal({ target: modal }, 'chainsawModal'); return; }
            const frame = document.getElementById('chainsawFrame');
            if (frame && !frame.getAttribute('src')) frame.setAttribute('src', CHAINSAW_URL);
            if (!isDesktop()) {
                const sub = document.getElementById('submitModal');
                if (sub.classList.contains('active')) { chainsawReturnToSubmit = true; closeModal({ target: sub }, 'submitModal', true); }
            }
            openModal('chainsawModal');
        }
        (function syncChainsawButton() {
            const modal = document.getElementById('chainsawModal');
            const btn = document.getElementById('btnChainsaw');
            if (!modal || !btn) return;
            const submit = document.getElementById('submitModal');
            const sync = () => {
                const on = modal.classList.contains('active');
                document.querySelectorAll('.btn-chainsaw, .btn-chainsaw-feed, .chainsaw-caption-pc').forEach(b => { b.classList.toggle('active', on); b.setAttribute('aria-pressed', String(on)); });
            };
            const mo = new MutationObserver(sync);
            mo.observe(modal, { attributes: true, attributeFilter: ['class'] });
            if (submit) mo.observe(submit, { attributes: true, attributeFilter: ['class'] });
        })();

        function refreshDockedProfile() {
            if (!isDesktop() || !currentUser || profileEditorOpen || !activeProfileUserId) return;
            if (!document.getElementById('profileModal').classList.contains('active')) return;
            openUserProfile(activeProfileUserId, { silent: true });
        }

        function scheduleDockRefresh() {
            if (!isDesktop()) return;
            clearTimeout(dockRefreshTimer);
            dockRefreshTimer = setTimeout(refreshDockedProfile, 500);
        }

        function closePanel(id) {
            if (id === 'authModal') return;
            if (id === 'profileModal') { if (viewingOtherProfile) showDefaultDock(); return; }
            closeModal({ target: document.getElementById(id) }, id);
        }

        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            const area = overlay.querySelector('.modal-drag-area');
            if (!area || overlay.id === 'submitModal') return;
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'panel-close-btn';

            btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
            btn.addEventListener('click', (ev) => { ev.stopPropagation(); closePanel(overlay.id); });
            area.appendChild(btn);

        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape' || !isDesktop()) return;
            if (e.target && e.target.classList && e.target.classList.contains('profile-search-input')) return;
            const open = DESKTOP_RIGHT_WINDOWS.filter(id => id !== 'submitModal' && !(id === 'searchModal' && !currentUser)).map(id => document.getElementById(id)).find(m => m && m.classList.contains('active'));
            if (open) { closeModal({ target: open }, open.id); return; }
            if (viewingOtherProfile) showDefaultDock();

        ['authUsername', 'authPassword'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && isDesktop()) { e.preventDefault(); submitAuth(); }
            });

        function onLayoutModeChange() {
            const profileEl = document.getElementById('profileModal');
            const authEl = document.getElementById('authModal');
            if (desktopMQ.matches) {
                document.body.classList.remove('modal-open');
                showDefaultDock();
                syncGuestMode();
                openDefaultRightWindow();
                updateControlsVisibility(feed.scrollTop);
            } else {
                // Возврат к мобильному виду: закрываем «приколотую» левую панель
                setPanelsCollapsed(false);
                viewingOtherProfile = false;
                profileEl.classList.remove('viewing-other');
                authEl.classList.remove('dock-covered');
                [profileEl, authEl, document.getElementById('chainsawModal')].forEach(m => {
                    clearTimeout(m._closeTimer);
                    m.classList.remove('active');
                    m.style.display = 'none';
                    m.style.zIndex = '';
                });
                if (document.querySelector('.modal-overlay.active')) {
                    document.body.classList.add('modal-open');
                    bottomControls.classList.add('hidden');
                    btnPulseDown.classList.add('hidden');
                    btnPulseUp.classList.add('hidden');
                } else {
                    document.body.classList.remove('modal-open');
                    updateControlsVisibility(feed.scrollTop);
                }
            }
        }
        if (desktopMQ.addEventListener) desktopMQ.addEventListener('change', onLayoutModeChange);
        else if (desktopMQ.addListener) desktopMQ.addListener(onLayoutModeChange);

        // Кнопка смены отображения повторяет состояния кнопок меню (скрытие у верха/низа ленты, уменьшение при прокрутке)
        (function syncPanelsToggle() {
            const t = document.getElementById('btnPanelsToggle');
            if (!t) return;
            const sync = () => {
                t.classList.toggle('hidden', bottomControls.classList.contains('hidden'));
                t.classList.toggle('shrunk', bottomControls.classList.contains('shrunk'));
            };
            new MutationObserver(sync).observe(bottomControls, { attributes: true, attributeFilter: ['class'] });
            sync();
        })();

        // Начальное состояние ПК-версии: слева профиль (или вход), справа загрузка медиа
        if (isDesktop()) { showDefaultDock(); syncGuestMode(); openDefaultRightWindow(); }

        setTimeout(() => {
            const topMask = document.querySelector('.blur-mask-top');
            const bottomMask = document.querySelector('.blur-mask-bottom');
            if (topMask) topMask.style.transform = 'translateZ(0)';
            if (bottomMask) bottomMask.style.transform = 'translateZ(0)';
        }, 100);
    </script>
<script>
(function () {
    var img = document.getElementById('logoImg');
    function syncLogoH() {
        if (img && img.offsetHeight) document.documentElement.style.setProperty('--logo-h', img.offsetHeight + 'px');
    }
    if (img) img.addEventListener('load', syncLogoH);
    window.addEventListener('resize', syncLogoH);
    syncLogoH();
})();
</script>
</body>
